/* ---------------------- 11. 开始 / 暂停 / 结束 ---------------------- */
async function startGame() {
  initAudio();
  stopMusic(true);                 // 先静音上一局（挂起态下直接归零，无爆音），避免重开/切曲叠音
  await resumeAudio();
  // 记录进入演奏前所在的模式屏（重开时保持原值，不会跳回主菜单）
  if (scrLevels.classList.contains('on')) returnScreen = 'levels';
  else if (scrTracks.classList.contains('on')) returnScreen = 'tracks';
  const song = SONG;
  // 曲目未就绪（嵌入数据异常/缓存失效）：不要带着空谱面进入演奏
  if (song.kind === 'audio' && (!song.peaks || !song.peaks.length || !song.buffer)) {
    showDialog({ title: t('loadFail'), text: t('staleDesc'), ok: t('ok') });
    return;
  }
  notes = chartsFor(song, settings.diff).map(function (n) {
    return { lane: n.lane, time: n.time, type: n.type, dur: n.dur, state: 0, judge: null, fx: 0 };
  });
  laneNotes = [[], [], [], []];
  notes.forEach(function (n) { laneNotes[n.lane].push(n); });
  totalNotes = notes.length;
  score = 0; combo = 0; maxCombo = 0; breaks = 0; bonus = 0;
  judged = 0; valSum = 0;
  maxLife = hasLife() ? DIFF[settings.diff].life : 100;
  life = maxLife;   // 关卡模式的血量；自由音轨改用下面的 meter
  meter = 0; meterShown = 0;   // 自由音轨血条：从 0 开始
  counts = { perfect: 0, great: 0, good: 0, bad: 0, early: 0, late: 0, miss: 0 };
  particles = []; popups = []; bursts = []; actBanner = null; currentSec = -1; endReason = '';
  laneFlash = [0, 0, 0, 0]; laneHold = [0, 0, 0, 0]; held = [false, false, false, false];
  mash = [0, 0, 0, 0]; whiffs = []; lanePress = [0, 0, 0, 0]; comboMile = null;
  resumeHold = false; rampStart = -1; visShift = 0;
  pointers.clear();
  nextEv = 0;
  updateSpeed();
  if (musicBus) { musicBus.gain.cancelScheduledValues(actx.currentTime); musicBus.gain.value = settings.music; }
  // 倒计时 3 秒（倒数 3-2-1）+ MUSIC_INTRO_DELAY 空档；t=0 才是音乐与第一个音符
  startTime = actx.currentTime + 3.0 + MUSIC_INTRO_DELAY;
  if (song.kind === 'audio') {
    // 音频曲目：整段音频一次排程，与判定共用同一个音频时钟
    bgmSrc = actx.createBufferSource();
    bgmSrc.buffer = song.buffer;
    bgmSrc.connect(musicBus);
    bgmSrc.start(startTime);
    tickSfx(startTime - 3, false); tickSfx(startTime - 2, false); tickSfx(startTime - 1, true);
  } else {
    // 程序化曲目：把开头 1 秒的事件（含倒数滴答，t<0）一次性预排，
    // 让"爆量建节点"分散在用户手势期间，消除倒计时结束那一瞬的卡顿
    const mus = song.music || [];
    while (nextEv < mus.length && mus[nextEv].t <= 1.0) {
      scheduleEvent(mus[nextEv], mus[nextEv].t + startTime);
      nextEv++;
    }
  }
  state = 'play';
  showScreen(null);
  hud.classList.add('on');
  $('hudSong').textContent = SONG.name;
  syncHud(true);
  banner(t(SONG.kind === 'audio' ? 'a1' : 'act1'), 0);
  audioWarm(startTime, SONG.buffer);   // 预热：PCM 页 + 缓冲静音切片 + 输出通路
}
function pauseGame() {
  releaseAllPointers();          // 暂停即释放全部按下状态
  if (state !== 'play' || !actx) return;
  state = 'paused'; pauseAt = actx.currentTime;
  resumeHold = false; rampStart = -1; visShift = 0;   // 清掉恢复过程（下次恢复重新计时）
  try { actx.suspend(); } catch (e) {}
  held = [false, false, false, false]; laneHold = [0, 0, 0, 0];
  showScreen('pause');
}
function resumeGame() {
  if (state !== 'paused' || !actx) return;
  const T0 = Math.max(0, pauseAt - startTime);          // 暂停处的歌曲时间（保持不动）
  /* 关键：不掐音频图、不回退时间。上下文继续挂起 → 音频源与 currentTime 一起冻结，
     所以音乐与谱面天然对齐；恢复期间把 startTime 钉在 T0，音符就停在原地。 */
  startTime = actx.currentTime - T0;                    // 挂起时 currentTime 冻结，这里等于钉住 T0
  resumeT0 = T0;
  resumeHold = true;
  resumeEndAt = performance.now() + RESUME_DELAY * 1000;
  visShift = -RESUME_REWIND;                            // 音符先回退 1.5 秒（前半段停在这里）
  rampStart = -1;
  visShift = 0;
  state = 'play';
  showScreen(null);                                     // 点继续立刻收起暂停菜单（画面里只有音符被冻住）
  hud.classList.add('on');
  syncHud(true);
}
function endGame(reason) {
  if (state === 'result') return;
  endReason = reason;
  state = 'result';
  stopMusic();
  held = [false, false, false, false]; laneHold = [0, 0, 0, 0];
  hud.classList.remove('on');
  actBanner = null; popups.length = 0; whiffs.length = 0;   // 清掉游玩残留，避免透到结算界面
  // 结算数据
  const acc = totalNotes ? valSum / totalNotes : 0;
  let s = liveScore();
  if (reason === 'fail') s = Math.round(s * 0.6);
  score = s;
  const isAP = reason !== 'fail' && counts.perfect === totalNotes && counts.miss === 0;
  let rank;                       // 两种模式同一套规则，没有 F：中断也按当前准确率评
  if (isAP) rank = 'AP';
  else if (acc >= 0.97) rank = 'S+';
  else if (acc >= 0.93) rank = 'S';
  else if (acc >= 0.88) rank = 'A';
  else if (acc >= 0.80) rank = 'B';
  else if (acc >= 0.70) rank = 'C';
  else rank = 'D';

  rollResultQuote(rank, reason === 'fail');   // 按成绩随机结算文案
  const rec = reason === 'fail' ? false : setBest(settings.diff, score, rank);
  const isAudio = SONG.kind === 'audio';
  $('resTitle').textContent = reason === 'fail' ? t(isAudio ? 'resFailSong' : 'resFail') : t(isAudio ? 'resClearSong' : 'resClear');
  const rk = $('resRank');
  rk.textContent = rank;
  rk.classList.toggle('fail', reason === 'fail');
  $('resDesc').textContent = isAP ? t(isAudio ? 'desApSong' : 'desAp')
    : (reason === 'fail' ? t(isAudio ? 'desFailSong' : 'desFail') : t(isAudio ? 'desClearSong' : 'desClear'));
  $('rScore').textContent = s.toLocaleString();
  $('rAcc').textContent = (acc * 100).toFixed(2) + '%';
  $('rCombo').textContent = maxCombo;
  $('rPerfect').textContent = counts.perfect;
  $('rGreat').textContent = counts.great;
  $('rGood').textContent = counts.good;
  $('rBad').textContent = counts.bad;
  $('rEarly').textContent = counts.early;
  $('rLate').textContent = counts.late;
  $('rMissed').textContent = counts.miss;
  $('rRecord').textContent = rec ? t('newRecord') : '';
  showScreen('result');
  if (actx) {
    if (reason === 'fail') { blip(actx.currentTime, 320, 0.5, 'sawtooth', 0.1); blip(actx.currentTime + 0.18, 240, 0.7, 'sawtooth', 0.09); }
    else if (isAP) { [880, 1320, 1760].forEach(function (f, i) { blip(actx.currentTime + i * 0.1, f, 0.35, 'sine', 0.08); }); }
    else { [660, 990].forEach(function (f, i) { blip(actx.currentTime + i * 0.1, f, 0.3, 'sine', 0.07); }); }
  }
  refreshBest();
}

/* ---------------------- 12. 判定 ---------------------- */
/* kind: perfect | great | good | bad | miss      side: early | late（仅 bad 使用） */
function applyJudge(n, kind, side) {
  if (state !== 'play') return;    // 结算/暂停后不再累计判定
  n.judge = kind;
  if (kind !== 'miss') n.fx = 1;   // miss 不用命中动画，只靠块自身灰化淡出   // fx 驱动本体消失与线状收束的短动画
  // 判定强度分级：Perfect 最亮，错误类最弱（错误不该有"打中"的爽感）
  laneFlash[n.lane] = kind === 'perfect' ? 1 : kind === 'great' ? 0.8 : kind === 'good' ? 0.5 : 0.3;
  if (kind === 'perfect') flashScreen = Math.max(flashScreen, 0.16);
  counts[kind]++; judged++; valSum += JUDGE_VAL[kind];
  if (kind === 'perfect' || kind === 'great' || kind === 'good') {
    combo++; if (combo > maxCombo) maxCombo = combo;
    if (combo === 10 || combo === 25 || combo === 50 || combo === 100 || combo === 200) comboMile = { n: combo, t: 0 };
    comboPop = 1;                         // 触发连击进位放大
    if (hasLife()) life = Math.min(maxLife, life + JUDGE_GAIN[kind]);
    else meter = Math.min(METER_MAX, meter + 1);          // 自由音轨：命中 +1 格
    mash[n.lane] = 0;
  } else if (kind === 'bad') {
    combo = 0; breaks++;
    counts[side]++;                       // Bad = early + late（结算强制满足该关系）
    if (n.type === 'hold') {
      // 长块过早/过晚：不立即消失，按 miss 的方式一直显示到尾块过线
      n.holdMissed = 1; n.holdBad = side || 'early'; n.holdBadT = 1;   // 先提示（过早/过晚色），随即转灰
    } else {
      n.badSide = side; n.badFade = 1;    // 普通块：变淡消失
    }
    if (hasLife()) life = Math.max(0, life + JUDGE_GAIN.bad * DIFF[settings.diff].drain);
    shake = Math.min(1, shake + 0.3);
    mash[n.lane] = 0;
  } else {                                // miss：超时未打击，自动判定
    combo = 0; breaks++;
    if (n.type !== 'hold') n.missFade = 1;   // 普通块原地灰化淡出
    else n.holdMissed = 1;                   // 长条不淡出：一直显示到尾块过线
    if (hasLife()) life = Math.max(0, life + JUDGE_GAIN.miss * DIFF[settings.diff].drain);
    else meter = Math.max(0, meter - 3);                  // 自由音轨：漏块 -3 格（10 次归零）
    shake = Math.min(1, shake + 0.55); flashScreen = 0.5;
  }
  popups.push({ lane: n.lane, j: (kind === 'bad' ? side : kind), t: 0 });
  spawnParticles(n.lane, kind);
  spawnBurst(n.lane, kind);
  sfxJudge(kind);
  if (hasLife() && life <= 0 && state === 'play') endGame('fail');
  syncHud();
}
/* 空击：不消耗音符、不断连，只给极微弱的视觉反馈；连续空击会升级为可消耗音符的 Early Bad */
function whiffLane(lane) {
  mash[lane] = Math.min(MASH_LIMIT + 3, mash[lane] + 1);
  whiffs.push({ lane: lane, t: 0 });
  laneFlash[lane] = Math.max(laneFlash[lane], 0.3);
  if (whiffs.length > 24) whiffs.shift();
}
function hitLane(lane) {
  lanePress[lane] = 1;             // 轻量即时反馈：按下就亮，不等判定结果
  if (state !== 'play') return;
  if (songTime() < -MUSIC_INTRO_DELAY) return;   // 只在倒计时期间禁用击打；0.5s 空档内允许提前命中
  if (resumeHold) return;                              // 恢复冻结期间不可击打
  const now = songTime() - settings.offset / 1000;
  const arr = laneNotes[lane];
  // 乱按升级：过早区间从 bad 扩大到 mash，让"狂点一轨"自己吃掉后面的音符
  const earlyLimit = mash[lane] >= MASH_LIMIT ? WIN.mash : WIN.bad;
  let target = null;
  for (let i = 0; i < arr.length; i++) {
    const n = arr[i];
    if (n.state !== 0) continue;
    const dt = now - n.time;
    if (dt < -earlyLimit) break;     // Early Ignore：太早，不消耗音符
    if (dt > WIN.bad) continue;      // Late Ignore：已超时（miss 检测已处理）
    target = n; break;
  }
  if (!target) { whiffLane(lane); return; }
  const dt = now - target.time, ad = Math.abs(dt);
  let kind, side = null;
  if (ad <= WIN.perfect) kind = 'perfect';
  else if (ad <= WIN.great) kind = 'great';
  else if (ad <= WIN.good) kind = 'good';
  else { kind = 'bad'; side = dt < 0 ? 'early' : 'late'; }
  applyJudge(target, kind, side);
  if (target.type === 'hold' && kind !== 'bad') target.state = 1;
  else target.state = 2;
}
function holdBroken(n) {
  combo = 0; breaks++;
  if (hasLife()) life = Math.max(0, life - 6 * DIFF[settings.diff].drain);
  else meter = Math.max(0, meter - 3);
  n.state = 2; n.holdBrokenFlag = 1;      // 断裂后不立刻消失：继续显示到尾块过线
  popups.push({ lane: n.lane, j: 'miss', t: 0, small: true });
  shake = Math.min(1, shake + 0.3);
  if (hasLife() && life <= 0 && state === 'play') endGame('fail');   // 自由音轨不会因血量中断
  syncHud();
}
function holdCleared(n) {
  n.state = 2; n.fx = 1; bonus += 300;
  popups.push({ lane: n.lane, j: 'perfect', t: 0, small: true });
  sfxHold();
  spawnParticles(n.lane, 'perfect', 6);
}

/* ---------------------- 13. 输入 ---------------------- */
const KEYMAP = {
  d: 0, f: 1, j: 2, k: 3,
  arrowleft: 0, arrowdown: 1, arrowup: 2, arrowright: 3,
};
window.addEventListener('keydown', function (e) {
  if (e.repeat) return;
  const k = (e.key || '').toLowerCase();
  if (k === 'escape') {
    if (state === 'play') pauseGame();
    else if (state === 'paused') resumeGame();
    return;
  }
  const lane = KEYMAP[k];
  if (lane === undefined) return;
  e.preventDefault();
  if (laneHold[lane] > 0) return;
  laneHold[lane]++; held[lane] = true;
  // 注：按下不再直接点亮轨道，亮度交由判定结果决定（空击只有极微弱反馈）
  if (state !== 'play') { if (state === 'menu') sfxUi(); return; }
  hitLane(lane);
}, { passive: false });
window.addEventListener('keyup', function (e) {
  const lane = KEYMAP[(e.key || '').toLowerCase()];
  if (lane === undefined) return;
  if (laneHold[lane] > 0) laneHold[lane]--;
  held[lane] = laneHold[lane] > 0;
});
window.addEventListener('blur', function () { releaseAllPointers(); pauseGame(); });

/* 指针 → 轨道：以画布实际矩形换算（不依赖 innerWidth，避免地址栏/缩放导致偏移） */
function laneFromX(clientX) {
  const r = cv.getBoundingClientRect();
  const x = (clientX - r.left) * (W / (r.width || W));
  if (x < PIN.x || x > PIN.x + PIN.w) return -1;
  return clamp(Math.floor((x - PIN.x) / PIN.laneW), 0, 3);
}
cv.addEventListener('pointerdown', function (e) {
  if (state !== 'play') return;
  const lane = laneFromX(e.clientX);
  if (lane < 0) return;
  e.preventDefault();
  if (pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, lane);
  laneHold[lane]++; held[lane] = true;
  if (settings.vibrate && plat.cfg.touch.vibrate && navigator.vibrate) { try { navigator.vibrate(8); } catch (err) {} }
  hitLane(lane);
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
}, { passive: false });
function pointerEnd(e) {
  const lane = pointers.get(e.pointerId);
  if (lane === undefined) return;
  pointers.delete(e.pointerId);
  if (laneHold[lane] > 0) laneHold[lane]--;
  held[lane] = laneHold[lane] > 0;
}
/* 兜底：切后台 / 失焦 / 指针被系统取消 / 暂停时，清空所有按下状态，避免"轨道一直按住" */
function releaseAllPointers() {
  pointers.clear();
  for (let i = 0; i < 4; i++) { laneHold[i] = 0; held[i] = false; }
}
cv.addEventListener('pointerup', pointerEnd);
cv.addEventListener('pointercancel', function (e) { pointerEnd(e); });
cv.addEventListener('lostpointercapture', pointerEnd);
cv.addEventListener('contextmenu', e => e.preventDefault());

/* ---------------------- 14. 更新 ---------------------- */
function tick(dt) {
  // 背景与粒子在任何状态都轻量更新
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    if (p.k === 'ring' || p.k === 'arc' || p.k === 'band') continue;   // 锚定判定线，不漂移
    if (p.rot !== undefined) p.rot += (p.vr || 0) * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 320 * dt;
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].t += dt;
    if (popups[i].t > 0.75) popups.splice(i, 1);
  }
  if (actBanner) { actBanner.t += dt; if (actBanner.t > 2.6) actBanner = null; }
  meterShown += (meter - meterShown) * Math.min(1, dt * 5);   // 血条缓慢升降
  if (comboMile) { comboMile.t += dt; if (comboMile.t > 1.1) comboMile = null; }
  for (let i = bursts.length - 1; i >= 0; i--) {
    bursts[i].t += dt;
    if (bursts[i].t > bursts[i].life) bursts.splice(i, 1);
  }
  for (let i = 0; i < 4; i++) laneFlash[i] = Math.max(0, laneFlash[i] - dt * 3.2);
  for (let i = 0; i < 4; i++) lanePress[i] = Math.max(0, lanePress[i] - dt * 5.5);   // 按下反馈衰减约 0.18s
  shake = Math.max(0, shake - dt * 2.6);
  flashScreen = Math.max(0, flashScreen - dt * 2.4);
  /* 恢复过程：① 冻结期把歌曲时间钉在 T0（音符一动不动，音乐也停着）
     ② 前 1.5s 停在回退位置，后 1.5s 从零速追平，3 秒整与歌曲同步。 */
  if (resumeHold) {
    startTime = actx.currentTime - resumeT0;            // 每帧钉住 → 歌曲时间恒为 T0
    if (performance.now() >= resumeEndAt - 150) { try { actx.resume(); } catch (e) {} }   // 提前恢复时钟，边界不抖
    /* 前 1.5s 停在"回退 1.5s"处；后 1.5s 从零速加速追平，3s 整正好等于暂停位置。
       g(u)=2u²-u³ → g(0)=0、g'(0)=0（零起速）、g(1)=1、g'(1)=1（末速 1，接回正常播放无跳变）。 */
    const nowMs = performance.now();
    const el = (nowMs - (resumeEndAt - RESUME_DELAY * 1000)) / 1000;
    if (el <= RESUME_DELAY - RESUME_RAMP) {
      visShift = -RESUME_REWIND;
    } else {
      const u = clamp((el - (RESUME_DELAY - RESUME_RAMP)) / RESUME_RAMP, 0, 1);
      const kk = RESUME_RAMP / RESUME_REWIND;              // =1.2：末速正好回到 1 倍，峰值最低
      const gg = (3 - kk) * u * u + (kk - 2) * u * u * u;
      visShift = -RESUME_REWIND * (1 - gg);
    }
    if (nowMs >= resumeEndAt) { resumeHold = false; rampStart = -1; visShift = 0; }
  }

  if (state !== 'play' || !actx) return;

  const now = songTime();
  // 调度音频事件（提前 0.3s 排程，保证节拍精准）——仅程序化曲目需要
  if (SONG.kind === 'proc') {
    const mus = SONG.music;
    while (nextEv < mus.length && mus[nextEv].t + startTime <= actx.currentTime + 0.3) {
      scheduleEvent(mus[nextEv], mus[nextEv].t + startTime);
      nextEv++;
    }
  }

  // 幕切换
  const sec = sectionForTime(now);
  if (sec !== currentSec) {
    if (currentSec !== -1 && now > 0) banner(actLabel(sec), sec);
    currentSec = sec;
    $('hudAct').textContent = actLabel(sec);
  }

  // 失误检测 + 命中余晖 / Bad 淡出衰减
  for (let i = 0; i < notes.length; i++) {
    const n = notes[i];
    if (n.fx > 0) n.fx = Math.max(0, n.fx - dt * 7);   // 命中后约 0.14s 内炸完消失
    if (n.badFade > 0) n.badFade = Math.max(0, n.badFade - dt * 2.2);   // Bad 淡出约 0.45s
    if (n.missFade > 0) n.missFade = Math.max(0, n.missFade - dt * 2.2);   // Miss 淡出约 0.45s
    if (n.holdBadT > 0) n.holdBadT = Math.max(0, n.holdBadT - dt * 3.4);   // 长块 Bad 提示约 0.3s
    if (n.state !== 0) continue;
    if (now > n.time + WIN.bad) { applyJudge(n, 'miss', null); n.state = 2; }
    if (state !== 'play') return;      // 生命归零已进入结算
  }
  // 空击计数衰减（约 0.4s 清一次）+ 空击反馈淡出 + 连击进位动画衰减
  for (let i = 0; i < 4; i++) if (mash[i] > 0) mash[i] = Math.max(0, mash[i] - dt * 2.6);
  if (comboPop > 0) comboPop = Math.max(0, comboPop - dt * 4.5);
  for (let i = whiffs.length - 1; i >= 0; i--) {
    whiffs[i].t += dt;
    if (whiffs[i].t > 0.28) whiffs.splice(i, 1);
  }
  // 长条维护
  for (let i = 0; i < notes.length; i++) {
    const n = notes[i];
    if (n.state !== 1) continue;
    if (now >= n.time + n.dur) holdCleared(n);
    else if (!held[n.lane] && now < n.time + n.dur - 0.12) holdBroken(n);
    if (n.state === 1) {                                   // 按住中：判定线上循环命中动画
      n.loopT = (n.loopT || 0) + dt;
      while (n.loopT >= HOLD_LOOP_PERIOD) {
        n.loopT -= HOLD_LOOP_PERIOD;
        spawnBurst(n.lane, 'hold');
      }
    }
    if (state !== 'play') return;
  }
  syncHud();

  if (now > SONG.duration + 0.5) endGame('clear');
}
function banner(text, sec) { actBanner = { text: text, t: 0, sec: sec }; }
/* 判定爆开：Perfect 大光环 + 横向冲击波 + 中心闪光；Bad/Miss 为暗色塌缩 + 叉号 */
function spawnBurst(lane, kind) {
  // Miss 不是爆开，而是判定线上的一圈轻微波动
  const life = kind === 'perfect' ? 0.42 : kind === 'great' ? 0.34 : kind === 'good' ? 0.26
    : (kind === 'miss' ? 0.5 : (kind === 'hold' ? HOLD_LOOP_PERIOD : 0.3));
  bursts.push({ lane: lane, kind: kind, t: 0, life: life });
  if (bursts.length > 12) bursts.shift();
}
function spawnParticles(lane, j, count) {
  if (j === 'miss') return;   // Miss 不用粒子：改用判定线上的轻微波动
  const base = count || (j === 'perfect' ? 18 : j === 'great' ? 12 : j === 'good' ? 6 : 5);
  const n = Math.max(2, Math.round(base * fxScale));   // 设备分级：小屏/降级动画时减少粒子
  const cx = PIN.x + lane * PIN.laneW + PIN.laneW / 2;
  const cy = PIN.judgeY;
  const col = JUDGE_COLOR[j];
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;
    const spm = j === 'perfect' ? 1.35 : j === 'great' ? 1.1 : j === 'good' ? 0.85 : 0.6;   // 错误类的碎片更蔫
    const sp = (140 + Math.random() * 320) * spm;
    particles.push({
      x: cx + (Math.random() - 0.5) * PIN.laneW * 0.7,
      y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.35 + Math.random() * 0.4, max: 0.75,
      size: 1.5 + Math.random() * 2.6, col: col,
    });
  }
  /* ---- 二次元科幻共振：判定等级决定特效"档位"，绝不满屏 ----
     全部复用 particles[]，只是不同 kind 的绘制方式不同；不新增循环、不新增系统。 */
  const laneW = PIN.laneW;
  const cap = function (v) { return Math.max(0.4, Math.min(1, v)); };
  if (j === 'perfect') {
    // 白色核心 → 粉紫多层冲击环（半径控制在单轨内，避免相邻音符光晕重叠）
    particles.push({ k: 'ring', x: cx, y: cy, r0: 4, r1: laneW * 0.52, w: 2.4, life: 0.24, max: 0.24, col: 'rgba(255,255,255,.9)' });
    particles.push({ k: 'ring', x: cx, y: cy, r0: 8, r1: laneW * 0.92, w: 2.2, life: 0.38, max: 0.38, col: 'rgba(' + COL.accent + ',.68)' });
    if (fxScale >= 1) particles.push({ k: 'ring', x: cx, y: cy, r0: 3, r1: laneW * 0.72, w: 1.5, life: 0.30, max: 0.30, col: 'rgba(' + COL.accentSoft + ',.58)' });   // 仅高配保留第三层
    // 少量几何碎片（菱形），数量随设备分级缩放
    const sn = Math.round(4 * cap(fxScale));
    for (let s = 0; s < sn; s++) {
      const aa = -Math.PI / 2 + (s / sn - 0.5) * 2.1 + (Math.random() - 0.5) * 0.3;
      const sp = 150 + Math.random() * 200;
      particles.push({
        k: 'shard', x: cx + (Math.random() - 0.5) * laneW * 0.4, y: cy,
        vx: Math.cos(aa) * sp, vy: Math.sin(aa) * sp,
        life: 0.42 + Math.random() * 0.22, max: 0.64, size: 3.4 + Math.random() * 2.2,
        rot: Math.random() * 3.14, vr: (Math.random() - 0.5) * 9,
        col: s % 2 ? 'rgba(255,255,255,.86)' : 'rgba(' + COL.accent + ',.82)',
      });
    }
  } else if (j === 'great' || j === 'good') {
    particles.push({ k: 'ring', x: cx, y: cy, r0: 4, r1: laneW * (j === 'great' ? 0.60 : 0.44),
      w: 2, life: j === 'great' ? 0.28 : 0.22, max: j === 'great' ? 0.28 : 0.22, col: 'rgba(' + COL.iceGlow + ',.66)' });
  }
  /* 高连击：只在里程碑出现弧形光轨 + 轨道共振带（不是每次击中都触发） */
  if (j === 'perfect' && combo >= 25 && combo % 25 === 0) {
    particles.push({ k: 'band', x: cx, y: cy, size: laneW * 0.86, life: 0.40, max: 0.40, col: 'rgba(' + COL.accent + ',.16)' });
    particles.push({ k: 'arc', x: cx, y: cy, size: laneW * 0.58, a0: -2.55, a1: -0.60, w: 2.4, life: 0.44, max: 0.44, col: 'rgba(' + COL.accent + ',.60)' });
  }
  if (particles.length > 320) particles.splice(0, particles.length - 320);   // 上限按最贵的一类（环形描边）设定
}

/* ---------------------- 15. HUD ---------------------- */
/* 满分 1,000,000：90% 来自判定质量，10% 来自连击，长条完走给少量奖励（封顶） */
function liveScore() {
  const acc = totalNotes ? valSum / totalNotes : 0;
  const comboPart = totalNotes ? maxCombo / totalNotes : 0;
  return Math.min(1000000, Math.round(900000 * acc + 100000 * comboPart + bonus));
}
let hudCache = {};
/* 连击进位：数值放大 + 按段位变色（t1 起手 → t4 高连击） */
function comboStyle() {
  if (combo >= 200) return 't4';
  if (combo >= 100) return 't3';
  if (combo >= 30) return 't2';
  if (combo >= 10) return 't1';
  return '';
}
function syncHud(force) {
  const sc = liveScore();
  if (force || hudCache.sc !== sc) { $('hudScore').textContent = sc.toLocaleString(); hudCache.sc = sc; }

      : (b >= METER_MAX * 0.6 ? '#b6e94f' : '#3ddc84')));   // 高值黄绿 → 低值绿

    if (isConsumed) {

        if (n.time >= now - 0.02 && (n.time - now) * pxPerSec <= jy + 120) {
          const gy = jy - (n.time - now) * pxPerSec;
          const tailY = (n.type === 'hold' && n.dur > 0) ? jy - (n.time + n.dur - now) * pxPerSec : gy;
          ctx.save();
          ctx.globalAlpha = 0.6;
          ctx.fillStyle = COL.noteHi || '#e8eefc';
          if (n.type === 'hold' && n.dur > 0) {
            /* 长条：画成整条（从尾部到头部），和它在 1 秒前的形状一致 */

            rrect(ctx, nx, top, nw, Math.max(nh, bot - top), Math.min(nw * 0.18, 10));
            ctx.fill();
            ctx.globalAlpha = 0.45;
            ctx.strokeStyle = COL.noteLo || COL.accentHex;
            ctx.lineWidth = 1.5;
            ctx.stroke();
          } else {
            rrect(ctx, nx, gy - nh / 2, nw, nh, nh * 0.36);
            ctx.fill();
            ctx.globalAlpha = 0.45;
            ctx.strokeStyle = COL.noteLo || COL.accentHex;
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
          ctx.restore();
          continue;
        }
      }
      if (n.state === 2 && n.fx <= 0 && !(n.badFade > 0) && !(n.missFade > 0) && !(n.holdMissed || n.holdBrokenFlag)) continue;
      if (n.type === 'hold' && n.state === 1 && n.dur > 0 && !n.holdMissed && !n.holdBrokenFlag) {
        /* 不是倒带时段：正在按住的长条照常由正常流程绘制 */
      } else if (n.type === 'hold' && n.state !== 2 && n.fx <= 0 && !(n.badFade > 0) && !(n.missFade > 0)) {
        continue;
      }
    }
    if (n.time - now > (jy + 120) / pxPerSec) break;      // 还没进入视野（notes 已按时间排序）
    if (n.time + n.dur - now < -0.35 && !(n.badFade > 0) && !(n.missFade > 0)) continue;   // 已越过（Bad / Miss 淡出中除外）
    let y = jy - (n.time - now) * pxPerSec;
    if (n.state === 1) y = Math.min(y, jy);               // 长条按住时头部钉在判定线上
    const accent = (n.acc !== undefined) ? n.acc : (n.lane === 0 || n.lane === 3);   // 多押整组统一色

    // Miss：块本身原地灰化淡出（不在判定线爆开，判定线上只弹字）
    if (n.missFade > 0) {
      const km = n.missFade;
      const ease = km * km * (3 - 2 * km);
      ctx.save();
      ctx.globalAlpha = clamp(ease * 0.85, 0, 1);
      ctx.fillStyle = COL.missHex;
      rrect(ctx, nx, y - nh / 2, nw, nh, nh * 0.36);
      ctx.fill();
      ctx.strokeStyle = COL.missHex;
      ctx.globalAlpha = clamp(ease * 0.5, 0, 1);
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
      continue;
    }
    // Bad：变为"错误色"并原地淡出（下落速度不变，不额外加速下坠）
    if (n.badFade > 0) {
      const k = n.badFade;                                  // 1 → 0
      const ease = k * k * (3 - 2 * k);                     // 平滑淡出曲线
      ctx.save();
      ctx.globalAlpha = clamp(ease * 1.05, 0, 1);
      const gb = ctx.createLinearGradient(0, y - nh / 2, 0, y + nh / 2);
      gb.addColorStop(0, COL.badHi);
      gb.addColorStop(1, COL.badHex);

      rrect(ctx, nx, y - nh / 2, nw, nh, nh * 0.36);

      ctx.restore();

    // 长条 = 加长版的普通块：与普通音符同宽同渐变，纵向拉伸覆盖 [尾, 头]

      const hy = Math.min(y, jy);                          // 头部（按住时钉在判定线）
      const yTail = jy - (n.time + n.dur - now) * pxPerSec;
      const top = Math.max(-40, yTail);
      const bot = Math.min(hy, jy - nh / 2);
      if (bot > top) {
        const gh = ctx.createLinearGradient(0, top, 0, bot);
        if (dead) { gh.addColorStop(0, deadCol); gh.addColorStop(1, deadCol); }
        else if (accent) { gh.addColorStop(0, COL.noteHi); gh.addColorStop(1, COL.accentHex); }
        else { gh.addColorStop(0, COL.iceHi); gh.addColorStop(1, COL.iceLo); }
        ctx.save();
        if (dead) ctx.globalAlpha = n.holdBadT > 0 ? 0.8 : 0.5;
        else {
          ctx.shadowColor = accent ? 'rgba(' + COL.accent + ',.7)' : 'rgba(' + COL.iceGlow + ',.5)';
          shadowFor(12);
        }
        ctx.fillStyle = gh;
        rrect(ctx, nx, top, nw, bot - top, nh * 0.36);
        ctx.fill();
        ctx.restore();
        // 主体边缘：低透明度描边，让长条与普通块风格统一、边界更清晰
        ctx.strokeStyle = dead ? 'rgba(255,255,255,.14)'
          : (accent ? 'rgba(' + COL.accent + ',.5)' : 'rgba(' + COL.iceGlow + ',.42)');
        ctx.lineWidth = 1;
        rrect(ctx, nx + 0.5, top + 0.5, nw - 1, Math.max(2, bot - top - 1), nh * 0.34); ctx.stroke();
        if (!dead && bot - top > 26) {          // 流动光带：位置由歌曲时间推导，不新增动画循环
          const span = bot - top;
          const off = ((songTime() * 0.55) % 1);
          const by = top + span * off;
          ctx.fillStyle = accent ? 'rgba(' + COL.accent + ',.13)' : 'rgba(' + COL.iceGlow + ',.11)';
          ctx.fillRect(nx + 2, by - 5, nw - 4, 10);
          ctx.fillStyle = 'rgba(255,255,255,.10)';
          ctx.fillRect(nx + 2, by - 1, nw - 4, 2);
        }
        ctx.fillStyle = 'rgba(255,255,255,' + (dead ? '.12' : '.35') + ')';   // 与普通块一致的高光条
        rrect(ctx, nx + 3, top + 3, nw - 6, Math.max(2, nh * 0.16), 2);
        ctx.fill();
      }
      // 头部：与普通块的画法完全一致（按住时停在判定线上）
      if (hy > -60 && hy < jy + 140) {
        const gh2 = ctx.createLinearGradient(0, hy - nh / 2, 0, hy + nh / 2);
        if (dead) { gh2.addColorStop(0, deadCol); gh2.addColorStop(1, deadCol); }
        else if (accent) { gh2.addColorStop(0, COL.noteHi); gh2.addColorStop(1, COL.accentHex); }
        else { gh2.addColorStop(0, COL.iceHi); gh2.addColorStop(1, COL.iceLo); }
        ctx.save();
        if (dead) ctx.globalAlpha = n.holdBadT > 0 ? 0.8 : 0.5;
        else {
          ctx.shadowColor = accent ? 'rgba(' + COL.accent + ',.85)' : 'rgba(' + COL.iceGlow + ',.7)';
          shadowFor(14);
        }
        ctx.fillStyle = gh2;
        rrect(ctx, nx, hy - nh / 2, nw, nh, nh * 0.36); ctx.fill();
        ctx.restore();
        ctx.fillStyle = 'rgba(255,255,255,' + (dead ? '.15' : '.5') + ')';
        rrect(ctx, nx + 3, hy - nh / 2 + 2.5, nw - 6, Math.max(2, nh * 0.16), 2); ctx.fill();
      }
      continue;                                            // 跳过通用 tap 绘制，避免重复画头
    }
    if (y < -60 || y > jy + 140) continue;
    // 命中：音符本体立即消失，只留一条向判定线收束的"线状光streak"（不用实心块）
    if (n.fx > 0) {
      const k = n.fx;                                       // 1 → 0，约 0.14s
      if (Math.abs(y - jy) > 2) {
        const grad = ctx.createLinearGradient(0, Math.min(y, jy), 0, Math.max(y, jy));
        grad.addColorStop(0, 'rgba(' + COL.accentSoft + ',' + (0.6 * k).toFixed(3) + ')');
        grad.addColorStop(1, 'rgba(' + COL.accent + ',0)');
        ctx.save();
        ctx.globalCompositeOperation = fxBlend();
        ctx.strokeStyle = grad;
        ctx.lineCap = 'round';
        ctx.lineWidth = Math.max(2, lw * 0.055) * k + 1;
        ctx.beginPath();
        ctx.moveTo(nx + nw / 2, y);
        ctx.lineTo(nx + nw / 2, jy);
        ctx.stroke();
        ctx.restore();
      }
      continue;
    }
    const g2 = ctx.createLinearGradient(0, y - nh / 2, 0, y + nh / 2);
    if (accent) { g2.addColorStop(0, COL.noteHi); g2.addColorStop(1, COL.accentHex); }
    else { g2.addColorStop(0, COL.iceHi); g2.addColorStop(1, COL.iceLo); }
    noteGlow(accent, nx, y, nw, nh);          // 手机：不发模糊，改用外扩低透明层
    ctx.save();
    ctx.shadowColor = accent ? 'rgba(' + COL.accent + ',.85)' : 'rgba(' + COL.iceGlow + ',.7)';
    shadowFor(14);
    ctx.fillStyle = g2;
    rrect(ctx, nx, y - nh / 2, nw, nh, nh * 0.36); ctx.fill();
    ctx.restore();
    // 边缘：一圈低透明青蓝描边，做出"能量片"的玻璃边界（不增加模糊，不影响读谱）
    ctx.strokeStyle = accent ? 'rgba(' + COL.accent + ',.55)' : 'rgba(' + COL.iceGlow + ',.45)';
    ctx.lineWidth = 1;
    rrect(ctx, nx + 0.5, y - nh / 2 + 0.5, nw - 1, nh - 1, nh * 0.34); ctx.stroke();
    // 高光：内层柔光条 + 顶沿一道细锐亮边
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    rrect(ctx, nx + 3, y - nh / 2 + 2.5, nw - 6, Math.max(2, nh * 0.16), 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    rrect(ctx, nx + 2.5, y - nh / 2 + 1.2, nw - 5, 1.4, 1); ctx.fill();

}
/* 判定飘字固定使用英文（所有语言一致） */
const JUDGE_LABEL = { perfect: 'PERFECT', great: 'GREAT', good: 'GOOD', early: 'EARLY', late: 'LATE', miss: 'MISS' };
function drawEffects() {
  // 粒子
  ctx.save();
  ctx.globalCompositeOperation = fxBlend();
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a;
    if (p.k === 'ring') {                       // 扩散光环：空心，不遮挡音符
      const prog = 1 - a;

      ctx.lineWidth = Math.max(1, p.w * a);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r0 + (p.r1 - p.r0) * prog, 0, 6.2832); ctx.stroke();

      const sn = p.size, ct = Math.cos(p.rot || 0), st = Math.sin(p.rot || 0);
      ctx.fillStyle = p.col;
      ctx.beginPath();
      ctx.moveTo(p.x + sn * st, p.y - sn * ct);
      ctx.lineTo(p.x + sn * 0.5 * ct, p.y + sn * 0.5 * st);
      ctx.lineTo(p.x - sn * st, p.y + sn * ct);
      ctx.lineTo(p.x - sn * 0.5 * ct, p.y - sn * 0.5 * st);

      ctx.strokeStyle = p.col; ctx.lineWidth = p.w;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, p.a0, p.a1); ctx.stroke();
      continue;
    }

      ctx.fillStyle = p.col;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size * 1.15, p.size, p.size * 1.15);
      continue;
    }
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x, p.y, p.size, p.size * 1.6);
  }
  ctx.restore();

  if (state === 'menu' || state === 'result') return;

  // 空击：极微弱的判定线反馈（不消耗音符、不断连）
  if (whiffs.length) {
    ctx.save();
    for (let i = 0; i < whiffs.length; i++) {
      const wf = whiffs[i];
      const a = (1 - wf.t / 0.28) * 0.14;
      if (a <= 0) continue;
      ctx.globalAlpha = a;
      ctx.fillStyle = COL.accentHex;
      const lx = PIN.x + wf.lane * PIN.laneW;
      ctx.fillRect(lx + PIN.laneW * 0.18, PIN.judgeY - 1, PIN.laneW * 0.64, 2);
    }
    ctx.restore();
  }

  // 判定爆开：固定在判定线上、与块同轨，全部由"线"构成并向外扩散
  for (let i = 0; i < bursts.length; i++) {
    const b = bursts[i];
    const k = clamp(b.t / b.life, 0, 1);
    const cx = PIN.x + b.lane * PIN.laneW + PIN.laneW / 2;
    const cy = PIN.judgeY;                                  // 锚点＝判定线，不随音符位置漂移
    const col = JUDGE_COLOR[b.kind] || JUDGE_COLOR.miss;    // 不同判定不同颜色
    const perfect = b.kind === 'perfect';
    const bad = (b.kind === 'bad');
    const unit = PIN.laneW / 105;
    const maxR = (perfect ? 68 : b.kind === 'great' ? 52 : bad ? 34 : (b.kind === 'hold' ? 36 : 40)) * unit;
    ctx.save();
    ctx.globalCompositeOperation = fxBlend();
    ctx.strokeStyle = col;
    ctx.lineCap = 'round';
    if (b.kind === 'miss') {
      // 轻微波动：沿判定线向两侧扩散的细波纹，带一点正弦起伏
      ctx.globalCompositeOperation = fxBlend();
      for (let w2 = 0; w2 < 2; w2++) {
        const kk = clamp(k * 1.15 - w2 * 0.18, 0, 1);
        if (kk <= 0) continue;
        const sw = PIN.laneW * 0.95 * kk;
        ctx.globalAlpha = (1 - kk) * 0.4 * (w2 ? 0.6 : 1);
        ctx.lineWidth = 2 * (1 - kk) + 0.6;
        ctx.beginPath();
        for (let s = -1; s <= 1.0001; s += 0.1) {
          const px2 = cx + s * sw;
          const py2 = cy + Math.sin(s * Math.PI * 1.6 + kk * 3.2) * 2.5 * (1 - kk);
          if (s <= -0.9999) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);

      // 错误：向内收束的断线环 + 叉号（纯线条，无实心块、无强光）
      ctx.globalAlpha = (1 - k) * 0.75;
      ctx.lineWidth = 2.2;
      const r = maxR * (1 - k * 0.75);
      for (let s = 0; s < 4; s++) {
        const a0 = s * Math.PI / 2 + k * 0.9;
        ctx.beginPath(); ctx.arc(cx, cy, r, a0, a0 + Math.PI / 2 - 0.4); ctx.stroke();
      }
      const xr = 7 * unit * (1 - k * 0.4);
      ctx.beginPath();
      ctx.moveTo(cx - xr, cy - xr); ctx.lineTo(cx + xr, cy + xr);
      ctx.moveTo(cx + xr, cy - xr); ctx.lineTo(cx - xr, cy + xr);
      ctx.stroke();

      // 命中：向外扩散的线圈（Perfect 双环）
      const rings = perfect ? 2 : 1;
      for (let r2 = 0; r2 < rings; r2++) {
        const kk = clamp(k * 1.25 - r2 * 0.22, 0, 1);
        if (kk <= 0) continue;
        ctx.globalAlpha = (1 - kk) * (perfect ? 0.95 : 0.7) * (r2 ? 0.6 : 1);
        ctx.lineWidth = (perfect ? 3.4 : 2.4) * (1 - kk) + 0.7;
        ctx.beginPath();
        ctx.arc(cx, cy, 4 + kk * maxR, 0, Math.PI * 2);
        ctx.stroke();
      }
      // 放射线：由中心向外扩撒的短线
      const spokes = perfect ? 8 : b.kind === 'great' ? 6 : 4;
      ctx.globalAlpha = (1 - k) * 0.8;
      ctx.lineWidth = 2 * (1 - k) + 0.6;
      const r0 = 4 + k * maxR * 0.5;
      const r1 = r0 + (perfect ? 20 : 13) * unit * (1 - k * 0.5);
      for (let s = 0; s < spokes; s++) {
        const a = (s / spokes) * Math.PI * 2 + Math.PI / 8;
        const ca = Math.cos(a), sa = Math.sin(a);
        ctx.beginPath();
        ctx.moveTo(cx + ca * r0, cy + sa * r0);
        ctx.lineTo(cx + ca * r1, cy + sa * r1);
        ctx.stroke();
      }
      // 沿判定线向两侧扩散的横向冲击线
      const sw = (perfect ? 1 : 0.72) * PIN.laneW * 1.15 * k;
      ctx.globalAlpha = (1 - k) * 0.85;
      ctx.lineWidth = 2 * (1 - k) + 0.8;
      ctx.beginPath();
      ctx.moveTo(cx - sw, cy); ctx.lineTo(cx + sw, cy);
      ctx.stroke();
    }
    ctx.restore();
  }
  // 判定文字
  for (let i = 0; i < popups.length; i++) {
    const p = popups[i];
    const k = p.t / 0.75;
    const a = clamp(1 - k, 0, 1);
    const jy = PIN.judgeY;
    const px = PIN.x + p.lane * PIN.laneW + PIN.laneW / 2;
    const py = jy - 34 - k * 26;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const size = p.small ? 12 : (p.j === 'early' || p.j === 'late') ? 13 : 15;
    ctx.font = '800 ' + size + 'px ui-monospace, monospace';
    if (p.j === 'miss' || p.j === 'hold') {
      ctx.fillStyle = 'rgba(212,138,178,' + (0.55 + 0.38 * a).toFixed(3) + ')';   // 低饱和红紫，不再像调试文本
      if (!noBlur()) { ctx.shadowColor = 'rgba(212,138,178,.7)'; ctx.shadowBlur = 9; }
    } else {
      ctx.fillStyle = JUDGE_COLOR[p.j] || JUDGE_COLOR.miss;
    }
    ctx.fillText(JUDGE_LABEL[p.j] || 'MISS', px, py);
    ctx.restore();
  }
}
/* 连击里程碑提示：局部文字缩放淡出（不做全屏闪光，尊重"画面特效"开关） */
function drawComboMile() {
  if (!comboMile) return;
  const k = clamp(comboMile.t / 1.1, 0, 1);
  const a = k < 0.15 ? k / 0.15 : (k > 0.62 ? (1 - k) / 0.38 : 1);

  ctx.fillStyle = 'rgba(' + COL.accent + ',1)';

function drawCountdown() {
  const now = songTime();
  let n = 0, frac = 0;
  if (resumeHold) {
    // 暂停恢复：3-2-1（墙钟计时；此时歌曲时间被钉住，音符停在原处）
    const left = Math.max(0, (resumeEndAt - performance.now()) / 1000);

    if (now >= end || now < start) return;
    n = Math.ceil(-now - gap);
    if (n < 1 || n > 3) return;
    frac = 1 - ((-now - gap) - Math.floor(-now - gap));

  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = clamp(frac, 0, 1);
  ctx.font = '800 ' + Math.round(Math.min(W, H) * 0.16) + 'px ui-monospace, monospace';
  ctx.fillStyle = COL.hi || 'rgba(255,255,255,.9)';
  ctx.fillText(String(n), W / 2, H * 0.34);
  ctx.font = '600 11px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(' + COL.accentSoft + ',.6)';
  ctx.fillText(t('start').toUpperCase(), W / 2, H * 0.34 + Math.min(W, H) * 0.11);
  ctx.restore();
}

  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.fillText(b.text, pfX, PIN.judgeY * 0.30);
  ctx.strokeStyle = 'rgba(' + COL.accent + ',.5)'; ctx.lineWidth = 1;
  const w = Math.min(PIN.w * 0.42, 220) * clamp(a * 1.4, 0, 1);
  ctx.beginPath();
  ctx.moveTo(pfX - w, PIN.judgeY * 0.30 + 18); ctx.lineTo(pfX + w, PIN.judgeY * 0.30 + 18);
  ctx.stroke();
  ctx.restore();
}

/* ---------------------- 17. 主循环 ---------------------- */
let renderSkip = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (dt > 0.05) dt = 0.05;
  tick(dt);
  render();
  // 菜单/设置/结算只有静态背景：降到约 20fps 重绘，减少移动端发热
  if (state === 'play' || state === 'paused') { renderSkip = 0; render(); }
  else if (++renderSkip >= 3) { renderSkip = 0; render(); }
}

/* ---------------------- 18. 启动 ---------------------- */
LANG = detectLang();
applyTheme(settings.theme);
layout();
syncSettingUI();
// 初始关卡：数据驱动注册（默认选中第一个）
// 先把已注入的嵌入曲目摘出来，避免下面重建内置关卡时被清掉
const keepSongs = SONGS.filter(function (s) { return s.embedded; });
SONGS.length = 0;
BUILTIN_DEFS.forEach(function (d) { SONGS.push(getBuiltinSong(d.id)); });
keepSongs.forEach(function (s) { SONGS.push(s); });
SONG = keepSongs[0] || SONGS[0];           // 嵌入版仍默认选中嵌入曲目
renderSongList();
resolvePlatform();                      // 解析运行模式（必须在所有定义就绪后调用）
rollMenuQuote();                        // 首屏是 HTML 直接显示的，这里补一次随机文案
warmAudioLater();                       // 空闲时预建音频上下文，避免首次进入演奏时的长卡顿
applyI18n();
requestAnimationFrame(frame);
// 恢复 IndexedDB 中的本地歌曲（无需重新分析）
restoreSongs().then(function (n) {
  if (!n) return;
  renderSongList();
  refreshStorage();
});
refreshStorage();
// 预生成线程占用极低的谱面已就绪，这里给菜单一个可点击的音频解锁
window.addEventListener('pointerdown', function once() {
  initAudio();
  resumeAudio();
  window.removeEventListener('pointerdown', once);
}, { once: true });

/* 多押辅助开关 */
(function () {
  const b = document.getElementById('btnMultiAid');
  if (!b) return;
  const sync = function () { b.textContent = t('multiAid') + ' → ' + (settings.multiAid ? t('vibOn') : t('vibOff')); };
  b.addEventListener('click', function () {
    settings.multiAid = settings.multiAid ? 0 : 1;
    saveCfg(); sync(); sfxUi();
  });
  sync();
})();
})();
</script>
</body>
