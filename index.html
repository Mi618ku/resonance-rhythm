<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12121a">
<title>RESONANCE · 音律核心</title>
<style>
  /* ===== 设计主旨：暗色科技 HUD —— 冷冽近黑背景 + 单一强调色(品红) + 极简构图 ===== */
  :root{
    --bg:#12121a; --bg2:#0d0d14; --fg:#eceef6; --dim:#878ba0;
    --bg-rgb:18,18,26; --accent:#ff4d8d; --accent-rgb:255,77,141;
    --accent-soft:#ff9ec6; --line:rgba(255,255,255,.10);
    --r:14px;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans SC","Hiragino Sans","Malgun Gothic",sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none;
  }
  .mono{font-family:ui-monospace,"JetBrains Mono",SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
  #cv{position:fixed;inset:0;display:block;touch-action:none}

  .layer{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .3s var(--ease),visibility .3s;
  }
  .layer.on{opacity:1;visibility:visible;pointer-events:auto}
  .layer.fade{background:radial-gradient(120% 80% at 50% 40%,rgba(var(--bg-rgb),.82),rgba(var(--bg-rgb),.96))}

  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  button:active{transform:scale(.97)}
  .cta{
    padding:0 26px;height:56px;min-width:240px;border-radius:var(--r);
    background:linear-gradient(135deg,var(--accent),var(--accent-soft));color:#1a0009;font-weight:800;
    letter-spacing:.14em;font-size:14px;text-transform:uppercase;
    box-shadow:0 12px 34px -14px rgba(var(--accent-rgb),.85);
    transition:transform .18s var(--ease),box-shadow .25s var(--ease),filter .2s;
  }
  .cta:hover{filter:brightness(1.08);box-shadow:0 16px 40px -14px rgba(var(--accent-rgb),.95)}
  .ghost{
    padding:0 20px;height:44px;border-radius:var(--r);border:1px solid var(--line);
    color:var(--dim);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    transition:color .2s,border-color .2s,background .2s;
  }
  .ghost:hover{color:var(--fg);border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.04)}
  .iconBtn{
    width:38px;height:38px;border-radius:12px;border:1px solid var(--line);color:var(--dim);
    display:grid;place-items:center;font-size:11px;letter-spacing:.05em;
  }
  .iconBtn:hover{color:var(--fg);border-color:rgba(255,255,255,.3)}

  /* ---------- 主菜单 ---------- */
  .menu{width:100%;max-width:520px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px}
  .brand{display:flex;flex-direction:column;align-items:center;gap:10px}
  .bmark{
    width:56px;height:56px;border-radius:50%;border:1px solid rgba(var(--accent-rgb),.5);
    position:relative;box-shadow:0 0 40px -6px rgba(var(--accent-rgb),.55) inset,0 0 22px -6px rgba(var(--accent-rgb),.6);
    animation:core 2.6s var(--ease) infinite;
  }
  .bmark::after{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--accent);opacity:.85;filter:blur(.5px)}
  @keyframes core{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.12);opacity:1}}
  h1{
    margin:0;font-size:clamp(34px,9.4vw,62px);font-weight:800;letter-spacing:.2em;
    text-indent:.2em;line-height:1;
    background:linear-gradient(180deg,var(--hi,#fff),var(--accent-soft) 55%,var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{font-size:12px;letter-spacing:.62em;text-indent:.62em;color:var(--dim);text-transform:uppercase}
  .tag{margin:0;color:var(--dim);font-size:13px;letter-spacing:.1em;line-height:1.7}

  .diffs{display:flex;gap:8px;padding:4px;border:1px solid var(--line);border-radius:var(--r)}
  .pill{
    padding:9px 18px;border-radius:10px;font-size:12px;letter-spacing:.16em;color:var(--dim);
    text-transform:uppercase;transition:all .2s var(--ease);
  }
  .pill:hover{color:var(--fg)}
  .pill.on{background:rgba(var(--accent-rgb),.14);color:var(--accent-soft);box-shadow:0 0 0 1px rgba(var(--accent-rgb),.35) inset}
  /* 长按中 / 缓存已失效 的曲目按钮状态 */
  .pill.pressing{background:rgba(255,255,255,.10);color:var(--fg);transform:scale(.97)}
  .pill.stale{opacity:.55;border-style:dashed;text-decoration:line-through}

  .best{font-size:12px;letter-spacing:.2em;color:var(--dim)}
  .best b{color:var(--fg);font-size:15px;letter-spacing:.08em;margin-left:8px}
  .hint{margin:0;font-size:11px;line-height:1.9;color:#5f6377;letter-spacing:.06em;max-width:400px}
  .quote{
    margin:0;max-width:440px;min-height:2.4em;display:flex;align-items:center;justify-content:center;
    font-size:12.5px;line-height:1.9;letter-spacing:.08em;color:var(--dim);text-align:center;
    padding:0 6px;transition:opacity .3s var(--ease);
  }
  .quote::before{content:'「';color:var(--accent);opacity:.5;margin-right:2px}
  .quote::after{content:'」';color:var(--accent);opacity:.5;margin-left:2px}
  .rquote{
    margin:2px 0 0;max-width:420px;font-size:11.5px;line-height:1.85;letter-spacing:.06em;
    color:var(--dim);text-align:center;opacity:.92;
  }

  /* ---------- 双入口 ---------- */
  .entries{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:540px}
  @media (max-width:640px){ .entries{grid-template-columns:1fr;gap:12px} .entry{min-height:112px} }
  .entry{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
    min-height:158px;padding:20px 16px;cursor:pointer;font-family:inherit;color:var(--fg);text-align:center;
    border:1px solid var(--line);border-radius:20px;
    background:linear-gradient(180deg,rgba(var(--accent-rgb),.11),rgba(var(--accent-rgb),.02));
    transition:transform .18s var(--ease),border-color .22s,box-shadow .26s;
  }
  .entry:hover,.entry:focus-visible{transform:translateY(-3px);border-color:rgba(var(--accent-rgb),.55);box-shadow:0 18px 44px -20px rgba(var(--accent-rgb),.8)}
  .entry .eIcon{font-size:30px;line-height:1;color:var(--accent);text-shadow:0 0 22px rgba(var(--accent-rgb),.6)}
  .entry .eTitle{font-size:17px;letter-spacing:.22em;font-weight:700}
  .entry .eSub{font-size:10.5px;letter-spacing:.1em;color:var(--dim);line-height:1.6}
  .scrHead{display:flex;align-items:center;gap:14px;width:100%;max-width:540px}
  .scrHead h2{margin:0;font-size:13px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;font-weight:600}

  /* ---------- 拖拽载入提示 ---------- */
  #dropHint{
    z-index:60;pointer-events:none;
    background:rgba(var(--bg-rgb),.55);
    -webkit-backdrop-filter:blur(18px) saturate(1.15);
    backdrop-filter:blur(18px) saturate(1.15);
  }
  #dropHint.on{pointer-events:none}
  .dropBox{
    display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;
    padding:40px 54px;border-radius:28px;
    border:2px dashed rgba(var(--accent-rgb),.65);
    background:rgba(var(--accent-rgb),.08);
    box-shadow:0 40px 110px -34px rgba(var(--accent-rgb),.95),0 0 0 1px rgba(var(--accent-rgb),.18) inset;
    animation:dropPulse 1.6s var(--ease) infinite;
  }
  @keyframes dropPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  .dropIcon{
    width:82px;height:82px;border-radius:24px;display:grid;place-items:center;
    font-size:44px;line-height:1;color:#fff;
    background:linear-gradient(160deg,var(--accent),rgba(var(--accent-rgb),.6));
    box-shadow:0 18px 46px -14px rgba(var(--accent-rgb),1),0 0 0 6px rgba(var(--accent-rgb),.12);
    text-shadow:0 2px 10px rgba(0,0,0,.35);
  }
  .dropText{margin:0;font-size:16px;font-weight:700;letter-spacing:.18em;color:var(--fg)}
  .dropSub{margin:0;font-size:11.5px;letter-spacing:.12em;color:var(--accent-soft);min-height:15px}

  /* ---------- 自由音轨列表 ---------- */
  .tracks{
    width:100%;max-width:540px;display:flex;flex-direction:column;gap:10px;
    max-height:min(50vh,400px);overflow-y:auto;overflow-x:hidden;padding:2px 6px 2px 2px;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  .tracks::-webkit-scrollbar{width:6px}
  .tracks::-webkit-scrollbar-thumb{background:rgba(var(--accent-rgb),.4);border-radius:3px}
  .trackItem{
    display:flex;align-items:center;gap:12px;width:100%;padding:13px 15px;cursor:pointer;text-align:left;
    font-family:inherit;color:var(--fg);border:1px solid var(--line);border-radius:14px;background:transparent;
    transition:border-color .2s,transform .16s var(--ease),background .2s;
  }
  .trackItem:hover{border-color:rgba(var(--accent-rgb),.5);transform:translateX(2px)}
  .trackItem.on{border-color:var(--accent);background:rgba(var(--accent-rgb),.09)}
  .trackItem.pressing{border-color:var(--accent);background:rgba(var(--accent-rgb),.16)}
  .trackItem .tMain{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
  .trackItem .tName{font-size:13.5px;letter-spacing:.05em;white-space:nowrap;overflow:hidden;min-width:0}
  .trackItem .tNameIn{display:inline-block;white-space:nowrap;padding-right:20px;will-change:transform}
  .trackItem .tName.scroll .tNameIn{animation:tNameScroll var(--dur,6s) ease-in-out infinite alternate}
  @keyframes tNameScroll{from{transform:translateX(0)}to{transform:translateX(var(--shift,-40px))}}
  .trackItem .tScore{
    flex:none;min-width:74px;text-align:right;white-space:nowrap;
    font-size:16px;font-weight:800;letter-spacing:.08em;color:var(--accent-soft);
    text-shadow:0 0 18px rgba(var(--accent-rgb),.35);
  }
  .trackItem .tScore.sel{font-size:15.5px;color:var(--fg);text-shadow:none}
  .trackItem .tScore.need{font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--dim);text-shadow:none}
  @media (max-width:420px){ .trackItem .tScore{min-width:62px;font-size:14px} }
  .trackItem .tMeta{font-size:10.5px;color:var(--dim);letter-spacing:.08em}
  .trackItem.stale .tName,.trackItem.stale .tMeta{color:var(--dim);opacity:.75}
  .tracksEmpty{font-size:11px;color:var(--dim);letter-spacing:.08em;text-align:center;padding:22px 0}
  .tdTitle{width:100%;max-width:540px;display:flex;flex-direction:column;gap:7px;text-align:center}
  .tdName{font-size:17px;letter-spacing:.04em;line-height:1.5;word-break:break-word}
  .tdMeta{font-size:10.5px;color:var(--dim);letter-spacing:.08em}
  .pvLine{margin:0;font-size:10.5px;line-height:1.7;letter-spacing:.04em;color:var(--dim);text-align:center;min-height:1.7em}

  /* ---------- 设置 ---------- */
  .panel{width:100%;max-width:460px;display:flex;flex-direction:column;gap:20px}
  .panel h2{margin:0;font-size:13px;letter-spacing:.34em;color:var(--dim);text-transform:uppercase;font-weight:600}
  .field{display:flex;flex-direction:column;gap:9px}
  .field .top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;letter-spacing:.14em;color:var(--dim)}
  .field .top b{color:var(--fg);letter-spacing:.04em}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:rgba(255,255,255,.16);border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(var(--accent-rgb),.16)}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--accent)}
  .calibDot{
    width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font-size:32px;
    border:2px solid rgba(var(--accent-rgb),.55);color:var(--accent);
    transition:transform .08s linear,background .08s linear,box-shadow .08s linear;
  }
  .calibDot.on{background:rgba(var(--accent-rgb),.38);transform:scale(1.14);box-shadow:0 0 34px -4px rgba(var(--accent-rgb),.9)}
  /* 设置项较多，小屏放不下：整层改为可滚动（不依赖内部类名），顶部对齐才能滑到最底 */
  #scrSettings{
    overflow-y:auto;overscroll-behavior:contain;align-items:flex-start;
    padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 26px);
    -webkit-overflow-scrolling:touch;scrollbar-width:thin;
  }
  #scrSettings::-webkit-scrollbar{width:4px}
  #scrSettings::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:2px}
  /* 手机模式：更大的点按目标、更紧的边距（只作用于 mobile，不影响 PC） */
  body.mode-mobile .menu{padding:14px}
  body.mode-mobile .cta{height:58px;font-size:15px}
  body.mode-mobile .ghost{min-height:46px}
  body.mode-mobile .tracks>button{min-height:64px}
  body.mode-mobile .pill{height:42px;min-width:74px}
  body.mode-mobile .entry{padding:16px}
  body.mode-mobile button{touch-action:manipulation}
  body.mode-pc .menu{padding:26px 22px}
  /* 手机端设置界面：卡片化留白，避免"整屏撑满"的压迫感 */
  body.mode-mobile #scrSettings{
    padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 28px);
  }
  body.mode-mobile #scrSettings .panel{
    gap:22px;padding:18px 16px 20px;border-radius:18px;
    background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);
    box-shadow:0 18px 46px -28px rgba(0,0,0,.9);max-width:520px;
  }
  body.mode-mobile #scrSettings .panel h2{font-size:12px;letter-spacing:.28em}
  body.mode-mobile .field .top{font-size:13px;letter-spacing:.10em}
  body.mode-mobile input[type=range]{height:3px}
  body.mode-mobile input[type=range]::-webkit-slider-thumb{width:22px;height:22px;box-shadow:0 0 0 5px rgba(var(--accent-rgb),.18)}
  body.mode-mobile .diffs{padding:5px}
  .langs{display:flex;gap:8px;flex-wrap:wrap}
  .langs .pill{border:1px solid var(--line)}
  .panel .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}

  /* ---------- HUD ---------- */
  /* 游玩时 HUD 覆盖层必须让点击穿透到 canvas（仅暂停按钮可点） */
  #hud{display:block;padding:0;pointer-events:none}
  .hudWrap{position:absolute;inset:0;pointer-events:none}
  /* 顶部：左上暂停 / 正上居中连击 / 右上分数 */
  .hudTop{
    position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right));
  }
  .hudTop .iconBtn{pointer-events:auto}
  .statBox{display:flex;flex-direction:column;gap:3px;min-width:96px}
  .statBox.r{align-items:flex-end}
  .lbl{font-size:9px;letter-spacing:.3em;color:#6c7085;text-transform:uppercase}
  .statBox b{font-size:22px;font-weight:700;letter-spacing:.02em;line-height:1}
  /* 连击：正上方绝对居中；进位时放大 + 变色（tier 由 JS 决定） */
  .comboBox{
    position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 7px);transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:1px;pointer-events:none;
  }
  .comboBox b{
    font-size:30px;font-weight:800;line-height:1;letter-spacing:.02em;
    color:#8b90a6;transform-origin:50% 60%;
    transition:color .18s var(--ease),text-shadow .18s var(--ease);
  }
  .comboBox b.t1{color:var(--dim)}
  .comboBox b.t2{color:var(--accent-soft)}
  .comboBox b.t3{color:var(--accent);text-shadow:0 0 18px rgba(var(--accent-rgb),.75)}
  .comboBox b.t4{color:var(--hi,#fff);text-shadow:0 0 22px rgba(var(--accent-rgb),.95),0 0 40px rgba(var(--accent-rgb),.6)}
  .comboBox .lbl{font-size:8px;letter-spacing:.34em;text-indent:.34em;opacity:.7}
  /* 底部：左下歌曲名 / 右下段落 */
  .hudBottom{
    position:absolute;bottom:calc(env(safe-area-inset-bottom) + 12px);left:0;right:0;
    display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
    padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right));
  }
  .songName{font-size:12px;letter-spacing:.16em;color:#9aa0b8;max-width:52vw;overflow:hidden;
    white-space:nowrap;text-overflow:ellipsis}
  .actLine{font-size:10px;letter-spacing:.3em;color:#6e7288;text-transform:uppercase;text-align:right}
  .track{height:2px;background:var(--track);overflow:hidden}
  .track i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-soft));transition:width .12s linear}
  .track.progTop{position:absolute;top:0;left:0;right:0;height:2px;background:var(--track)}
  .track.life{position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--track)}
  .track.life i{background:linear-gradient(90deg,#33e0c0,#8affea);transition:width .18s var(--ease),background .3s}
  .track.life.low i{background:linear-gradient(90deg,#ff4d6d,#ff9aa8)}
  #hudTime{margin-left:auto;font-size:10.5px;letter-spacing:.1em;color:var(--dim)}

  /* ---------- 结算 ---------- */
  .result{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
  .rtitle{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:var(--dim);text-transform:uppercase}
  /* 评级与总分紧挨在一起 */
  .rankRow{display:flex;align-items:center;justify-content:center;gap:18px;line-height:1}
  .rankRow .scoreBox{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
  .rankRow .scoreBox b{font-size:clamp(22px,6vw,30px);font-weight:700;letter-spacing:.01em}
  .rank{font-size:clamp(64px,20vw,110px);font-weight:800;line-height:.95;letter-spacing:.02em;
    background:linear-gradient(180deg,var(--hi,#fff),var(--accent-soft) 60%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .rank.fail{background:linear-gradient(180deg,#8e93a8,#4b4f61);-webkit-background-clip:text;background-clip:text}
  .rdesc{font-size:12.5px;line-height:1.9;color:var(--dim);letter-spacing:.08em;max-width:380px}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(84px,1fr));gap:14px 10px;width:100%;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0}
  .stats div{display:flex;flex-direction:column;gap:5px}
  .stats span{font-size:9px;letter-spacing:.26em;color:#6c7085;text-transform:uppercase}
  .stats b{font-size:17px;font-weight:700}
  .rec{font-size:11px;letter-spacing:.24em;color:var(--accent-soft);min-height:14px}
  .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

  @media (max-width:420px){
    .cta{min-width:200px;height:52px}
    .statBox b{font-size:19px}
    .stats{grid-template-columns:repeat(3,minmax(64px,1fr));gap:12px 6px}
    .stats b{font-size:15px}
    .stats span{font-size:8px;letter-spacing:.16em}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s!important;transition-duration:.08s!important}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<input type="file" id="fileSong" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac,.aac" multiple hidden>
<div class="layer" id="dropHint">
  <div class="dropBox">
    <div class="dropIcon">⤓</div>
    <p class="dropText" data-i18n="dropHint"></p>
    <p class="dropSub mono" id="dropCount"></p>
  </div>
</div>

<!-- ===== HUD ===== -->
<div class="layer" id="hud">
  <div class="hudWrap">
    <div class="track progTop"><i id="progFill"></i></div>
    <div class="hudTop">
      <button class="iconBtn" id="btnPause">❙❙</button>
      <div class="statBox r"><span class="lbl" data-i18n="score"></span><b class="mono" id="hudScore">0</b></div>
    </div>
    <div class="comboBox">

<script>
(function () {
'use strict';

/* ======================================================================
   RESONANCE · 音律核心 —— 4 轨判定式音游
   音乐与谱面均由代码程序化生成（零外部资源），谱面严格对齐节拍网格。
   ====================================================================== */

/* ---------------------- 1. 基础常量 ---------------------- */
/* 程序化曲目参数：由 buildProcSong() 在生成前写入（支持多个不同 BPM/风格的初始关卡） */
let BPM = 128;
let SPB = 60 / BPM;            // 每拍秒数
let BAR = SPB * 4;             // 每小节秒数
let TOTAL_BARS = 44;           // 小节数
let SONG_END = TOTAL_BARS * BAR;
let STYLE = null;              // 当前生成中的曲目风格参数

// 和弦进行（可复用）：Am-F-C-G / Dm-Bb-F-C / Am-Em-F-G
const PROGS = [
  [[57, 60, 64], [53, 57, 60], [48, 55, 60], [55, 59, 62]],
  [[50, 53, 57], [46, 50, 53], [53, 57, 60], [48, 55, 60]],
  [[57, 60, 64], [52, 55, 59], [53, 57, 60], [55, 59, 62]],
];
// 五声音阶：A 小调 / D 小调
const SCALES = [
  [69, 72, 74, 76, 79, 81],
  [62, 65, 67, 69, 72, 74],
];

/* 判定窗口（秒）——以音符判定时刻为中心的五段区间
   Early Ignore │ Early Bad │ Good │ Great │ Perfect │ Great │ Good │ Late Bad │ Late Ignore
   两端 Ignore 段：忽略打击，不消耗音符、不断连，只给极微弱的空击反馈
   手感取向接近《BanG Dream!》，移动端整体 ×1.2 放宽                        */
const WIN_BASE = { perfect: 0.065, great: 0.110, good: 0.150, bad: 0.180, mash: 0.450 };
let WIN = Object.assign({}, WIN_BASE);
let windowScale = 1;
/* 是否触屏 / 小屏（判定宽容度与手指占用上限共用同一判定） */
function isCoarse() {
  return (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
    ('ontouchstart' in window) || Math.min(W || 9999, H || 9999) < 560;
}
function applyWindowScale() {
  const coarse = isCoarse();
  windowScale = coarse ? 1.2 : 1;
  Object.keys(WIN_BASE).forEach(function (k) { WIN[k] = WIN_BASE[k] * windowScale; });
}
const JUDGE_VAL = { perfect: 1, great: 0.72, good: 0.38, bad: 0.10, miss: 0 };
const JUDGE_GAIN = { perfect: 1.5, great: 0.9, good: 0.25, bad: -4.0, miss: -6.5 };
/* JUDGE_COLOR 由 applyTheme() 重建，见主题系统 */
const MASH_LIMIT = 3;      // 同轨连续空击达到该次数后，过早区间升级为 Bad（惩罚乱按）
const MUSIC_INTRO_DELAY = 0.5;   // 倒计时结束后留出的空档：音乐/谱面整体后移 0.5s
const RESUME_DELAY = 3.0;        // 暂停恢复时的倒计时长度（秒）

/* ---------------------- 手指占用上限 ----------------------
   同时刻"正在按住的长条 + 新落的 tap"不能超过上限：触屏 ≤2、桌面 ≤3。
   超限时丢掉优先级最低的 tap（先丢非整拍、再丢非强拍，同分丢高轨）。 */
function fingerCap() { return isCoarse() ? 2 : 3; }
function applyFingerLimit(list, spb) {
  const cap = fingerCap();
  const src = list.slice().sort(function (a, b) { return a.time - b.time || a.lane - b.lane; });
  const iv = [];
  src.forEach(function (n) { if (n.type === 'hold') iv.push({ s: n.time, e: n.time + n.dur }); });
  const liveHolds = function (t) {
    let c = 0;
    for (let i = 0; i < iv.length; i++) if (iv[i].s <= t + PRESS_WIN && iv[i].e >= t) c++;   // 窗口内开始的长条也算占手指
    return c;
  };
  /* 判定窗口：原来只把"完全同一时刻"当同时，导致 40ms 内要连按的音符没被计入，
     而按住中的长条又占着一根手指 → 实际会出现"需要 4 根手指"的时刻。 */
  const PRESS_WIN = 0.04;
  const out = [];
  const pressed = [];                     // 窗口内刚按下、手指还没抬起来的点击时刻
  let i = 0;
  while (i < src.length) {
    const t = src[i].time;
    while (pressed.length && pressed[0] < t - PRESS_WIN) pressed.shift();
    let j = i;
    const grp = [];
    while (j < src.length && src[j].time - t < PRESS_WIN) { grp.push(src[j]); j++; }
    const gh = grp.filter(function (n) { return n.type === 'hold'; });
    const gt = grp.filter(function (n) { return n.type !== 'hold'; });
    const used = liveHolds(t) + gh.length + pressed.length;   // 长条 + 本组新起的长条 + 上一窗口还没抬起的点击
    const room = Math.max(0, cap - used);
    if (gt.length <= room) {
      grp.forEach(function (n) { out.push(n); });
    } else {
      const sc = gt.map(function (n) {
        // 同一时刻的 tap 时间相同，拍子分档必然一样，真正能区分的是是否重音轨
        // （lane 0/3 为重音轨、1/2 为冰轨）与拍子档位（整拍 > 十六分）
        const q = spb > 0 ? n.time / spb : 0;
        const onBeat = Math.abs(q - Math.round(q)) < 0.06;
        const strong = onBeat && (Math.round(q) % 2 === 0);
        const acc = (n.lane === 0 || n.lane === 3) ? 1 : 0;
        return { n: n, s: (strong ? 3 : (onBeat ? 2 : 1)) * 2 + acc };
      }).sort(function (a, b) { return b.s - a.s || a.n.lane - b.n.lane; });
      gh.forEach(function (n) { out.push(n); });
      for (let k = 0; k < room && k < sc.length; k++) { out.push(sc[k].n); pressed.push(t); }
    }
    i = j;
  }
  out.sort(function (a, b) { return a.time - b.time || a.lane - b.lane; });
  return out;
}
/* 长条同侧禁用：长条占用某轨时，同侧相邻轨在长条持续期间（含尾部半拍缓冲）不放音符 */
const SIDE_PAIR = [1, 0, 3, 2];
/* 最终硬保证：把"按住中的长条"当一直占着手指，逐颗检查任意 40ms 窗口内的手指需求；
   超限时丢掉点击（长条一律保留）。这是最后一道闸，保证不会出现"需要 4 根手指"的谱面。 */
function enforceFingerCap(list, cap, win) {
  const W = win || 0.04;
  const keep = [], pr = [];
  for (let i = 0; i < list.length; i++) {
    const n = list[i];
    while (pr.length && pr[0] < n.time - W) pr.shift();
    let live = 0;
    for (let k = 0; k < keep.length; k++) {
      const hd = keep[k];
      if (hd.type === 'hold' && hd.time <= n.time + W && hd.time + hd.dur >= n.time) live++;
    }
    if (n.type !== 'hold' && live + pr.length + 1 > cap) continue;   // 点击超限 → 丢掉
    keep.push(n);
    if (n.type !== 'hold') pr.push(n.time);
  }
  return keep;
}
function applyHoldSideBan(notes, spb) {
  const buf = spb > 0 ? spb * 0.5 : 0.25;
  const iv = [];
  notes.forEach(function (n) {
    if (n.type !== 'hold') return;
    iv.push({ n: n, lane: n.lane, side: SIDE_PAIR[n.lane], s: n.time - 1e-6, e: n.time + n.dur + buf });
  });
  if (!iv.length) return notes;
  const mobile = isCoarse();                                  // 只有手机端需要"内侧长条 → 外侧不留音符"
  const gap = (spb > 0 ? spb : 0.4) * 0.30;                   // 搬迁后与同轨其它音符的最小间距
  const busy = [[], [], [], []];
  notes.forEach(function (n) { busy[n.lane].push(n.time); });
  const laneFree = function (lane, t) {
    for (let i = 0; i < busy[lane].length; i++) if (Math.abs(busy[lane][i] - t) < gap) return false;
    for (let i = 0; i < iv.length; i++) {                     // 目标轨此刻是否正被长条占用
      const h = iv[i];
      if (h.lane !== lane && h.side !== lane) continue;
      if (t >= h.s && t <= h.e) return false;
    }
    return true;
  };
  const out = [];
  notes.forEach(function (n) {
    let hitHold = null;
    for (let i = 0; i < iv.length; i++) {
      const h = iv[i];
      if (h.n === n) continue;                                // 自己不算冲突
      if (n.lane !== h.lane && n.lane !== h.side) continue;
      if (n.time < h.s || n.time > h.e) continue;
      hitHold = h; break;
    }
    if (!hitHold) { out.push(n); return; }
    if (!mobile) {                                            // 电脑端：与改动前完全一致（长条豁免，普通音符移除）
      if (n.type === 'hold') out.push(n);
      return;
    }
    /* 手机端（最多双押）：先挪到"另一只手"的轨道，靠外的轨优先；两条都占着才丢弃 */
    const cands = hitHold.lane <= 1 ? [3, 2] : [0, 1];
    for (let k = 0; k < cands.length; k++) {
      const L = cands[k];
      if (!laneFree(L, n.time)) continue;
      n.lane = L;
      if (n.type === 'hold') { n.type = 'tap'; n.dur = 0; }    // 长条换轨会压到别的音符 → 降级为点击
      busy[L].push(n.time);
      out.push(n);
      return;
    }
  });
  return out;
}

let actx = null, master = null, musicBus = null, sfxBus = null, analyser = null, freqData = null, noiseBuf = null;

/* 首次创建 AudioContext 会阻塞主线程数百毫秒（实测 headless 403ms），
   而音符位置由音频时钟推导 —— 卡顿后音符必然前跳一截。
   把这次一次性开销提前到页面空闲时完成：无手势时创建上下文是允许的（状态为 suspended），
   真正开始播放仍需手势（resumeAudio）。 */
/* 音频预热（针对手机/WebView 上"重新打开后第一次游玩"的一次性卡顿，实测 Via 158~178ms、Edge 无）：
   ① PCM 内存页预热：解码后的大缓冲（2 分钟立体声约 40MB）首次被音频线程读取时会产生页错误，
      用一次线性扫描把页提前摸进来——放在开局（倒计时之前），不占用演奏时间轴；
   ② 同一缓冲的静音切片：在歌曲开始前 2.2s 用增益 1e-6 播放 0.25 秒（读取真实缓冲，走完整音频链路）；
   ③ 极轻振荡器：点亮输出通路。
   三者在歌曲开始前都已结束，不影响同步与判定偏移。 */
function warmPcmBuffer(buf) {
  if (!buf || !buf.getChannelData) return 0;
  let touched = 0;

      let acc = 0;
      for (let i = 0; i < d.length; i += 512) { acc += d[i]; touched++; }

}

      const bg = actx.createGain();
      bg.gain.value = 0.000001;
      bg.connect(musicBus);
      const bs = actx.createBufferSource();
      bs.buffer = buffer; bs.connect(bg);
      const off = Math.min(Math.max(1, buffer.duration * 0.3), Math.max(1, buffer.duration - 0.4));
      bs.start(Math.max(actx.currentTime + 0.05, at - 2.2), off, 0.25);
    }

    wg.gain.value = 0.0008;
    wn.frequency.value = 220;
    wn.connect(wg); wg.connect(musicBus);
    wn.start(Math.max(actx.currentTime + 0.02, at - 1.6));

function wobble(o, t0, dur, cents) {
  if (!cents) return;
  const lfo = actx.createOscillator(), lg = actx.createGain();
  lfo.__mod = 1;                                          // 标记：调制器，不是发声体
  lfo.type = 'sine';
  lfo.frequency.value = 0.45 + Math.random() * 0.35;      // 0.45~0.8 Hz：听得出的"晃"
  lg.gain.value = cents;
  lfo.connect(lg); lg.connect(o.detune);

function edmDelay() {
  if (delayFx) {
    delayFx.delay.delayTime.setValueAtTime(Math.max(0.05, SPB * STYLE_PACKS.edm.lead.time), actx.currentTime);
    return delayFx;
  }
  const input = actx.createGain();
  const dl = actx.createDelay(2.0);
  const damp = actx.createBiquadFilter();
  const fb = actx.createGain();
  dl.delayTime.value = Math.max(0.05, SPB * STYLE_PACKS.edm.lead.time);   // 附点八分
  fb.gain.value = STYLE_PACKS.edm.lead.fb;
  damp.type = 'lowpass'; damp.frequency.value = 3000;
  input.connect(dl); dl.connect(damp); damp.connect(musicBus);
  damp.connect(fb); fb.connect(dl);
  delayFx = { in: input, delay: dl };
  return delayFx;
}

function padEDM(t0, a) {

  lp.connect(g); g.connect(musicBus);

function leadStrings(t0, a) {
  const P = STYLE_PACKS.piano.lead, m = a.m, d = a.d || SPB * 1.6, v = a.v || 1;

  g.gain.exponentialRampToValueAtTime(P.vol * v, t0 + P.atk);      // 极长起音
  g.gain.setValueAtTime(P.vol * v, t0 + hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + hold + P.rel);  // 极长释放
  lp.connect(g); g.connect(musicBus);
  for (let k = 0; k < 2; k++) {                            // 两个失谐 triangle = 弦乐群
    const o = actx.createOscillator();
    o.type = P.wave; o.frequency.value = midi(m);
    o.detune.value = (k === 0 ? -P.detune : P.detune);
    const lfo = actx.createOscillator(), lg = actx.createGain();
    lfo.__mod = 1;                                       // 标记：颤音调制器
    lfo.type = 'sine'; lfo.frequency.value = P.vib; lg.gain.value = P.vibDepth;
    lfo.connect(lg); lg.connect(o.detune);
    lfo.start(t0); lfo.stop(t0 + hold + P.rel + 0.1);
    o.connect(lp); o.start(t0); o.stop(t0 + hold + P.rel + 0.05);
  }
}
function padStrings(t0, a) {
  const P = STYLE_PACKS.piano.pad, ms = a.m || [], dur = a.d || BAR, v = a.v || 1;
  const lp = actx.createBiquadFilter(), g = actx.createGain();
  lp.type = 'lowpass'; lp.frequency.value = P.lp; lp.Q.value = 0.7;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(P.vol * v, t0 + P.atk);      // 慢起
  g.gain.setValueAtTime(P.vol * v, t0 + dur * 0.8);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + P.rel);   // 慢收
  lp.connect(g); g.connect(musicBus);
  for (let i = 0; i < ms.length; i++) {
    for (let k = 0; k < P.voices; k++) {
      const o = actx.createOscillator();
      o.type = P.wave; o.frequency.value = midi(ms[i]);
      o.detune.value = (k - (P.voices - 1) / 2) * P.detune;
      o.connect(lp); o.start(t0); o.stop(t0 + dur + P.rel + 0.05);
    }
  }
}

/* 事件 → 乐器：按事件的风格标签选引擎；该风格没有这件乐器就直接不发声 */
function scheduleEvent(e, at) {
  if (!actx) return;
  const a = e.a || {};
  if (e.k === 'tick') { tickSfx(at, a.hi); return; }
  const eng = ENGINES[e.pk] || ENGINES.edm;
  const fn = eng[e.k];
  if (!fn) return;
  fn(at, a);
}

/* --- 音效 --- */
function blip(t0, f, dur, type, vol) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(sfxBus); o.start(t0); o.stop(t0 + dur + 0.02);
}
function tickSfx(t0, hi) { blip(t0, hi ? 1560 : 940, 0.07, 'square', 0.16); }
function sfxJudge(j) {
  if (!actx || state !== 'play') return;
  if (j === 'miss') return;              // 漏击静音：不发声（Bad 仍保留错误音）
  const now = actx.currentTime;
  if (j === 'perfect') { blip(now, 1720, 0.055, 'square', 0.075); blip(now + 0.012, 2580, 0.05, 'sine', 0.05); }
  else if (j === 'great') blip(now, 1280, 0.05, 'square', 0.06);
  else if (j === 'good') blip(now, 880, 0.05, 'triangle', 0.06);
  else blip(now, 150, 0.14, 'sawtooth', 0.07);
}
function sfxHold() { if (actx) blip(actx.currentTime, 2200, 0.09, 'sine', 0.06); }
function sfxUi() { if (actx) blip(actx.currentTime, 1180, 0.05, 'square', 0.05); }

/* ---------------------- 6. 乐曲生成（事件表） ---------------------- */
/* 幕划分按小节比例，便于不同长度的曲目共用同一套结构 */
function sectionAt(bar) {
  const f = bar / Math.max(1, TOTAL_BARS);
  if (f < 0.181) return 0;   // 第一幕：稀疏，只有心跳与低频
  if (f < 0.548) return 1;   // 第二幕：鼓组进入，八分音符流动
  if (f < 0.910) return 2;   // 第三幕：全编制，十六分与和弦
  return 3;                  // 尾声：沉寂
}
/* ===== 6.1 三条互相独立的编曲循环（按风格标签分派） =====
   buildMusicEvents 按曲目的风格标签分派到 buildEDM / buildLofi / buildOrchestral。
   三条分支的循环结构、步长、鼓点落点算法完全不同（不是同一张 16 格表换参数）：
     · EDM  ：for (beat < 4) 逐拍四踩 + for (i < 8|16) 半拍/十六分断奏贝斯 + 副歌 16 分琶音
     · Lo-Fi：没有固定格，按"切分位池 + 随机留白"散点落鼓，整小节空掉，大量留白
     · Piano：没有鼓组，for (i < 8|16) 分解和弦撑节奏 + 长音弦乐旋律
   发什么音由事件的 pk 标签决定（见上面的 ENGINES / STYLE_PACKS）。 */
function buildMusicEvents() {
  const pk = STYLE.style || 'edm';
  const ev = [];
  const push = function (t, k, a) { ev.push({ t: t, k: k, a: a || {}, pk: pk }); };
  push(-3, 'tick', { hi: false }); push(-2, 'tick', { hi: false }); push(-1, 'tick', { hi: true });
  if (pk === 'lofi') buildLofi(push);
  else if (pk === 'piano') buildOrchestral(push);
  else buildEDM(push);
  ev.sort(function (x, y) { return x.t - y.t; });
  return ev;
}

/* ---------- ① EDM：四踩 + Acid 贝斯 + 方波延迟主音 ---------- */
function buildEDM(push) {
  const prog = PROGS[Math.abs(STYLE.prog | 0) % PROGS.length];
  const scale = SCALES[Math.abs(STYLE.penta | 0) % SCALES.length];
  const rnd = mulberry32(9101 + (STYLE.seed | 0));
  const V = STYLE.variant || 'festival';
  const rollBass = (V === 'acid');          // 十六分滚动贝斯
  const hats16 = (V === 'bigroom');         // 十六分闭镲
  const leadOn = !(STYLE.arr === 'arpOnly');  // 副歌只留琶音（Arp only）
  for (let bar = 0; bar < TOTAL_BARS; bar++) {
    const t0 = bar * BAR, sec = sectionAt(bar), ch = prog[bar % prog.length], root = ch[0] - 12;
    const full = (sec === 1 || sec === 2), chorus = (sec === 2);

    /* ① 底鼓：Four-on-the-floor —— 逐拍一脚 */
    if (full) {
      for (let beat = 0; beat < 4; beat++) push(t0 + beat * SPB, 'kick', { v: beat === 0 ? 1 : 0.82 });
    } else if (sec === 0) {
      for (let beat = 0; beat < 4; beat += 2) push(t0 + beat * SPB, 'kick', { v: 0.7 });
    } else {
      push(t0, 'kick', { v: 0.8 });
    }
    /* ② 军鼓 / 拍手：固定 2、4 拍；bigroom 在乐句尾补一串十六分 */
    if (full) {
      push(t0 + SPB, 'snare', { v: 0.78 });
      push(t0 + 3 * SPB, 'snare', { v: 0.9 });
      if (V === 'bigroom' && bar % 4 === 3) {
        for (let i = 0; i < 4; i++) push(t0 + 3 * SPB + i * SPB / 4, 'snare', { v: 0.36 + i * 0.14 });
      }
    }
    /* ③ 镲：反拍开镲（House 标志），bigroom 再叠十六分闭镲 */
    if (full) {
      for (let beat = 0; beat < 4; beat++) push(t0 + (beat + 0.5) * SPB, 'hat', { o: true, v: 0.32 });
      if (hats16) {
        for (let i = 0; i < 16; i++) if (i % 2 === 1) push(t0 + i * SPB / 4, 'hat', { o: false, v: 0.17 });
      }
    }
    /* ④ 贝斯：每半拍（acid 变体为每十六分）一个断奏 */
    if (full) {
      const step = rollBass ? SPB / 4 : SPB / 2;
      const cnt = rollBass ? 16 : 8;
      for (let i = 0; i < cnt; i++) {
        const m = root + (i % 4 === 3 ? 12 : (i % 2 === 1 ? 7 : 0));
        push(t0 + i * step, 'bass', { m: m, d: step * 0.55, v: i % 2 ? 0.6 : 0.85 });
      }
    } else if (sec === 0) {
      push(t0, 'bass', { m: root, d: BAR * 0.85, v: 0.5 });
    } else {
      push(t0, 'bass', { m: root, d: SPB * 1.6, v: 0.7 });
    }
    /* ⑤ 琶音：副歌无脑十六分连击 */
    if (chorus) {
      for (let i = 0; i < 16; i++) {
        push(t0 + i * SPB / 4, 'arp', { m: ch[i % 3] + 24, d: SPB * 0.2, v: i % 4 === 0 ? 0.95 : 0.6 });
      }
    } else if (sec === 1) {
      for (let i = 0; i < 8; i++) push(t0 + i * SPB / 2, 'arp', { m: ch[i % 3] + 12, d: SPB * 0.3, v: 0.5 });
    }
    /* ⑥ 主音：方波 + Delay，副歌八分音符（lead<=1 时第二幕也进）；强拍踩和弦音，弱拍走音阶 */
    if (full && leadOn && (chorus || (sec === 1 && STYLE.lead <= 1))) {
      for (let i = 0; i < 8; i++) {
        if (i % 4 === 3 && rnd() < 0.45) continue;
        const m = (i % 2 === 0) ? ch[i % 3] + 12 : scale[Math.floor(rnd() * scale.length)];
        push(t0 + i * SPB / 2, 'lead', { m: m, d: SPB * 0.34, v: 0.85 });
      }
    }
    /* ⑦ Pad：整小节铺底 */
    push(t0, 'pad', { m: ch, d: BAR * 0.98, v: chorus ? 0.5 : 0.72 });
    /* ⑧ 段落转折 / 乐句头的镲片 */
    if (full && bar % 8 === 4) push(t0, 'crash', { v: 0.7 });
  }
}

/* ---------- ② Lo-Fi：散点切分，大量留白 ---------- */
function buildLofi(push) {
  const prog = PROGS[Math.abs(STYLE.prog | 0) % PROGS.length];
  const scale = SCALES[Math.abs(STYLE.penta | 0) % SCALES.length];
  const rnd = mulberry32(3307 + (STYLE.seed | 0));
  const pick = function (arr) { return arr[Math.floor(rnd() * arr.length)]; };
  /* 切分位池：全部避开正拍 1 / 3，落下去就不会是"动次打次" */
  const OFF = [0.75, 1.25, 1.5, 1.75, 2.25, 2.5, 2.75, 3.25, 3.5, 3.75];
  const light = (STYLE.arr === 'lightDrums');       // 更空
  for (let bar = 0; bar < TOTAL_BARS; bar++) {
    const t0 = bar * BAR, sec = sectionAt(bar), ch = prog[bar % prog.length], root = ch[0] - 12;
    const kickDrop = (STYLE.arr === 'dropout' && sec === 2);             // 副歌抽掉底鼓（军鼓/镲/旋律继续）
    const drumsIn = (sec >= 1 && sec < 3);
    const breatheP = (STYLE.sparse >= 2) ? 0.30 : (light ? 0.36 : 0.18);
    const breathe = drumsIn && rnd() < breatheP;                         // 整小节留白

    if (drumsIn && !breathe) {
      /* 底鼓：1~3 脚，只有第一脚在正拍，其余全散在切分位 */
      if (!kickDrop) {
        const nK = (STYLE.sparse >= 2) ? (1 + (rnd() < 0.35 ? 1 : 0))
          : (1 + (rnd() < 0.55 ? 1 : 0) + (rnd() < 0.18 ? 1 : 0));
        for (let i = 0; i < nK; i++) {
          push(t0 + (i === 0 ? 0 : pick(OFF)) * SPB, 'kick', { v: i === 0 ? 0.88 : 0.52 });
        }
      }
      /* 军鼓：慵懒落点（2 / 2.5 / 3 拍），偶尔一个 ghost */
      push(t0 + pick([2, 2, 2.5, 3]) * SPB, 'snare', { v: 0.72 });
      if (rnd() < 0.34) push(t0 + pick([3.5, 3.75]) * SPB, 'snare', { v: 0.34 });
      /* 镲：3~6 个散点，全部在切分位 */
      const nH = 3 + Math.floor(rnd() * 4);
      for (let i = 0; i < nH; i++) push(t0 + pick(OFF) * SPB, 'hat', { o: rnd() < 0.1, v: 0.22 + rnd() * 0.26 });
    } else if (sec === 0) {
      /* 前奏：每小节一下"心跳"，再加一点散落的镲，别让开头完全没东西按 */
      push(t0, 'kick', { v: 0.5 });
      if (rnd() < 0.35) push(t0 + 2.5 * SPB, 'kick', { v: 0.34 });
      if (rnd() < 0.5) push(t0 + 3.75 * SPB, 'hat', { v: 0.18 });
    }
    /* 贝斯：纯正弦长音，一小节最多两个，不抢戏 */
    if (sec >= 1) {
      push(t0, 'bass', { m: root, d: SPB * (1.5 + rnd() * 0.8), v: 0.85 });
      if (rnd() < 0.45) push(t0 + 2 * SPB, 'bass', { m: root + (rnd() < 0.5 ? 7 : 5), d: SPB * 1.3, v: 0.6 });
    } else {
      push(t0, 'bass', { m: root, d: BAR * 0.9, v: 0.5 });
    }
    /* 琶音：稀疏梦境音，只落在切分位 */
    if (sec >= 1 && sec < 3) {
      const nA = 1 + Math.floor(rnd() * 3);
      for (let i = 0; i < nA; i++) push(t0 + pick(OFF) * SPB, 'arp', { m: pick(ch) + 12, d: SPB * 0.9, v: 0.6 + rnd() * 0.3 });
    }
    /* 主旋律：一句 1~3 个长音，慵懒（前奏也走一句） */
    if (!breathe && (drumsIn || (sec === 0 && rnd() < 0.7))) {
      let beat = rnd() < 0.5 ? 0 : pick([0.75, 1.5]);
      const nL = 1 + Math.floor(rnd() * 3);
      for (let i = 0; i < nL && beat < 3.6; i++) {
        push(t0 + beat * SPB, 'lead', { m: pick(scale), d: SPB * (1.1 + rnd()), v: 0.8 });
        beat += 1 + Math.floor(rnd() * 2);
      }
    }
    /* Pad：整小节铺底 */
    push(t0, 'pad', { m: ch, d: BAR * 0.96, v: sec === 2 ? 0.55 : 0.72 });
    if (bar === 0 || bar % 16 === 15) push(t0, 'crash', { v: 0.35 });
  }
}

/* ---------- ③ Piano / Orchestral：没有鼓组，琶音 + 长音撑节奏 ---------- */
function buildOrchestral(push) {
  const prog = PROGS[Math.abs(STYLE.prog | 0) % PROGS.length];
  const scale = SCALES[Math.abs(STYLE.penta | 0) % SCALES.length];
  const rnd = mulberry32(5153 + (STYLE.seed | 0));
  const pick = function (arr) { return arr[Math.floor(rnd() * arr.length)]; };
  const solo = (STYLE.arr === 'arpOnly');     // 副歌只留钢琴琶音，弦乐退场
  for (let bar = 0; bar < TOTAL_BARS; bar++) {
    const t0 = bar * BAR, sec = sectionAt(bar), ch = prog[bar % prog.length], root = ch[0] - 12;

    /* ① 打击：kick / snare 已删除，只剩木鱼与沙锤 */
    if (sec >= STYLE.drums && sec < 3) {
      push(t0, 'wood', { v: sec === 2 ? 0.8 : 0.55 });
      if (bar % 2 === 0) push(t0 + 2 * SPB, 'wood', { v: 0.42 });
      if (sec === 2) {
        const nS = 3 + Math.floor(rnd() * 3);
        for (let i = 0; i < nS; i++) push(t0 + (0.5 + i) * SPB, 'shaker', { v: 0.26 + rnd() * 0.3 });
      } else if (rnd() < 0.5) {
        push(t0 + 1.5 * SPB, 'shaker', { v: 0.3 });
      }
    }
    /* ② 低音：大提琴拨弦（极短起音 + 极快衰减） */
    push(t0, 'bass', { m: root, d: SPB * 0.4, v: 0.95 });
    if (sec >= 1) push(t0 + 2 * SPB, 'bass', { m: root + (bar % 4 === 3 ? 12 : 7), d: SPB * 0.35, v: 0.7 });
    if (sec === 2) push(t0 + 3 * SPB, 'bass', { m: root + 12, d: SPB * 0.3, v: 0.55 });
    /* ③ 钢琴分解和弦：整首曲子的节奏骨架 */
    const tones = [ch[0] + 12, ch[2] + 12, ch[1] + 12, ch[2] + 12];
    if (sec === 2 && !solo) {
      for (let i = 0; i < 16; i++) push(t0 + i * SPB / 4, 'arp', { m: tones[i % 4], d: SPB * 0.45, v: i % 4 === 0 ? 1 : 0.6 });
    } else if (sec >= 1) {
      for (let i = 0; i < 8; i++) push(t0 + i * SPB / 2, 'arp', { m: tones[i % 4], d: SPB * 0.75, v: i % 4 === 0 ? 0.95 : 0.62 });
    } else {
      for (let i = 0; i < 4; i++) push(t0 + i * SPB, 'arp', { m: tones[i % 4], d: SPB * 1.3, v: 0.7 });
    }
    /* ④ 弦乐主旋律：长音，慢起慢收 */
    if (sec >= STYLE.lead && sec < 3 && !(solo && sec === 2)) {
      const n = (sec === 2) ? 3 : 2;
      for (let i = 0; i < n; i++) {
        push(t0 + i * (sec === 2 ? 1.33 : 2) * SPB, 'lead', { m: pick(scale), d: SPB * (sec === 2 ? 1.2 : 2.2), v: 0.9 });
      }
    }
    /* ⑤ 弦乐群铺底 */
    if (!(solo && sec === 2)) push(t0, 'pad', { m: ch, d: BAR * 0.99, v: sec === 3 ? 0.5 : (sec === 2 ? 0.6 : 0.75) });
  }
}


/* ---------------------- 7. 谱面生成（严格对齐节拍网格） ---------------------- */
/* 谱面由音乐事件推导：锚点乐器（鼓组曲 kick/snare/lead，钢琴曲 wood/shaker/arp/lead）
   是音符来源，pad / 长 bass / crash / 段落首拍是长条来源。
   难度只调整"保留概率 + 密度 + 长条频率"，不再切换图案。 */
const KEEP_P = {
  easy:   { kick: 1.00, snare: 0.55, lead: 0.22, wood: 1.00, shaker: 0.50, arp: 0.18, chordBar: 0.25, holdChance: 0.55, holdBeats: [4, 2] },
  normal: { kick: 1.00, snare: 0.90, lead: 0.60, wood: 1.00, shaker: 0.80, arp: 0.38, chordBar: 0.50, holdChance: 0.34, holdBeats: [2, 4] },
  hard:   { kick: 1.00, snare: 1.00, lead: 0.92, wood: 1.00, shaker: 1.00, arp: 0.55, chordBar: 0.75, holdChance: 0.22, holdBeats: [1, 2] },
};

function buildChart(diff, music) {
  const P = KEEP_P[diff] || KEEP_P.normal;
  const step = SPB / 4;                                   // 一格 = 十六分音符
  const minSteps = (diff === 'easy') ? 2 : 1;             // easy 两格，normal/hard 一格
  const rnd = mulberry32(20101 + diff.length * 977 + (STYLE ? STYLE.seed : 0));
  const toK = t => Math.round(t / step);                  // 量化到网格（事件本身即网格对齐）
  const evList = (music || []).filter(function (e) { return e.t >= 0; });
  /* 哪些乐器能出音符：鼓组风格用 kick / snare / lead；
     钢琴风格没有 kick / snare，改用木鱼、沙锤、琶音、弦乐（否则整首歌只有中轨有音符）。 */
  const ANCHOR = (STYLE && STYLE.anchor === 'melodic')
    ? { wood: 1, shaker: 1, arp: 1, lead: 1 }
    : { kick: 1, snare: 1, lead: 1 };

  /* ---- 1) 锚点：只有 ANCHOR 里的乐器才产生音符，没鼓点的地方不放 ---- */
  const byK = {};
  const rank = { snare: 0, shaker: 0, kick: 1, wood: 1, lead: 2, arp: 3 };   // 反拍 snare 优先（否则高轨永远拿不到音符）
  evList.forEach(function (e) {
    if (!ANCHOR[e.k]) return;
    if (rnd() > P[e.k]) return;                           // 难度只调概率
    const k = toK(e.t);
    const a = { k: k, kind: e.k, m: (e.a && e.a.m !== undefined) ? e.a.m : 0 };
    if (!byK[k] || rank[e.k] < rank[byK[k].kind]) byK[k] = a;
  });
  const crashK = {}, padK = {}, longBassK = {};
  evList.forEach(function (e) {
    const k = toK(e.t);
    if (e.k === 'crash') crashK[k] = 1;
    if (e.k === 'pad') padK[k] = 1;
    if (e.k === 'bass' && e.a && e.a.d >= SPB * 1.5) longBassK[k] = 1;
  });
  const barOfK = k => Math.floor((k * step) / BAR);
  const beatOfK = k => Math.round(((k * step) - barOfK(k) * BAR) / SPB);

  /* ---- 2) 轨道映射：kick 低轨 / snare 高轨 / lead 中轨（按音高分两轨） ---- */
  const kindLane = { kick: -1, snare: -1, lead: -1, wood: -1, shaker: -1, arp: -1 };  // 各族上次用的轨：族内交替，既防连打又不越族
  const familyFlip = function (l) {
    if (l === 0) return 1; if (l === 1) return 0;
    if (l === 3) return 2; return 3;
  };
  const laneFor = function (a, avoid) {
    let l;
    if (a.kind === 'kick') l = (kindLane.kick === 0) ? 1 : 0;          // 低轨族 0/1
    else if (a.kind === 'snare') l = (kindLane.snare === 3) ? 2 : 3;   // 高轨族 3/2
    else if (a.kind === 'wood') l = (kindLane.wood === 0) ? 1 : 0;     // 木鱼：低轨族
    else if (a.kind === 'shaker') l = (kindLane.shaker === 3) ? 2 : 3; // 沙锤：高轨族
    else if (a.kind === 'arp') l = (kindLane.arp === 0) ? 3 : 0;       // 琶音：外轨族 0/3
    else l = (kindLane.lead === 1) ? 2 : 1;                            // 中轨族 1/2
    if (l === avoid) l = familyFlip(l);
    kindLane[a.kind] = l;
    return l;
  };

  /* ---- 3) 最小间隔：必须为网格步长的整数倍，且不小于难度下限 ---- */
  const taps = [];
  let lastK = -1e9;
  Object.keys(byK).map(Number).sort(function (a, b) { return a - b; }).forEach(function (k) {
    const a = byK[k];
    if (k - lastK < minSteps) return;
    const bt = beatOfK(k);
    a.isBarHead = (bt === 0);
    a.isBeat = (bt % 2 === 0);                            // 强拍（第 1 / 3 拍）
    a.isCrash = !!crashK[k];
    a.lane = laneFor(a, -1);
    lastK = k;
    taps.push(a);
  });

  /* ---- 4) 双押：小节头（按难度概率）与 crash（必出） ---- */
  const notes = [];
  taps.forEach(function (a) {
    a.chord = a.isCrash || (a.isBarHead && rnd() < P.chordBar);
  });

  /* ---- 5) 长条：跟随 pad 起音 / 长 bass / crash 衰减 / 段落切换首拍 ---- */
  const holds = [];
  let lastHoldBar = -99;
  for (let bar = 0; bar < TOTAL_BARS; bar++) {
    const sec = sectionAt(bar);
    if (sec === 2) continue;                              // 高潮段不放长条
    if (bar - lastHoldBar < 2) continue;                  // 两根长条之间至少隔一小节
    const phraseEnd = (bar % 4 === 3);                    // 乐句收尾
    let chance = P.holdChance * (phraseEnd ? 1.7 : 1);
    if (sec === 0 || sec === 3) chance *= 1.5;            // 前奏 / 尾声多放
    const secChange = (bar > 0 && sectionAt(bar - 1) !== sec);
    // 只在强拍起：第 1 拍优先，其次第 3 拍
    const cands = [toK(bar * BAR), toK(bar * BAR + SPB * 2)];
    let k0 = -1, kEndLimit = toK((bar + 1) * BAR) - 1;
    for (let ci = 0; ci < cands.length; ci++) {
      const kk = cands[ci];
      if (padK[kk] || longBassK[kk] || crashK[kk] || (ci === 0 && secChange)) { k0 = kk; break; }
    }
    if (k0 < 0) continue;
    if (rnd() > chance) continue;
    const beats = P.holdBeats[rnd() < 0.5 ? 0 : 1];       // 整数拍长度
    let steps = Math.round(beats * SPB / step);
    const capSteps = kEndLimit - k0;                      // 不跨小节
    if (steps > capSteps) steps = Math.round(SPB / step) * (capSteps >= Math.round(SPB / step) ? 1 : 0);
    if (steps < Math.round(SPB / step)) continue;         // 至少一拍
    // 该轨在长条期间 + 结束后半拍（2 格）内必须没有别的音符
    let lane = -1;
    for (let l = 0; l < 4; l++) {
      let busy = false;
      for (let i = 0; i < taps.length; i++) {
        const a = taps[i];
        if (a.lane === l && a.k >= k0 && a.k <= k0 + steps + 2) { busy = true; break; }
      }
      if (!busy) { lane = l; break; }
    }
    if (lane < 0) continue;
    lastHoldBar = bar;
    holds.push({ lane: lane, k0: k0, steps: steps, k1: k0 + steps, clearK: k0 + steps + 2 });
  }

  /* ---- 6) 落地：剔除被长条占用的音符，长条用整数拍时长 ---- */
  const inHold = function (a) {
    for (let i = 0; i < holds.length; i++) {
      const hd = holds[i];
      if (hd.lane === a.lane && a.k >= hd.k0 && a.k <= hd.clearK) return true;
    }
    return false;
  };
  taps.forEach(function (a) {
    if (inHold(a)) return;
    notes.push({ lane: a.lane, time: +(a.k * step).toFixed(4), type: 'tap', dur: 0 });
    if (a.chord) {
      const l2 = (a.lane + 2) % 4;                        // 双押隔两轨
      let clash = false;
      for (let i = 0; i < holds.length; i++) {
        const hd = holds[i];
        if (hd.lane === l2 && a.k >= hd.k0 && a.k <= hd.clearK) { clash = true; break; }
      }
      if (!clash) notes.push({ lane: l2, time: +(a.k * step).toFixed(4), type: 'tap', dur: 0 });
    }
  });
  holds.forEach(function (hd) {
    notes.push({ lane: hd.lane, time: +(hd.k0 * step).toFixed(4), type: 'hold', dur: +(hd.steps * step).toFixed(4) });
  });
  notes.sort(function (a, b) { return a.time - b.time || a.lane - b.lane; });
  // 生成后再过两道规则：长条同侧禁用 → 手指占用上限
  return applyFingerLimit(applyHoldSideBan(notes, SPB), SPB);
}

/* ======================================================================
   7.5 曲目系统
   - core：内置程序化音轨（上面生成的 MUSIC 事件表 + CHARTS）
   - audio：任意本地音频文件（浏览器内解码 + 起音检测自动生成谱面）
   谱面完全由音乐本身推导：起音时刻直接来自音频的谱通量峰值，
   因此每个音符都踩在真实的钢琴/鼓点攻击上，不需要人工打谱。
   ====================================================================== */

/* ---- 起音检测（4 段带通滤波 + 谱通量 + 自适应阈值峰值挑选） ---- */
// RBJ 双二阶带通系数
function bpCoeff(f0, Q, sr) {
  const w = 2 * Math.PI * f0 / sr, cw = Math.cos(w), sw = Math.sin(w), alpha = sw / (2 * Q);
  const b0 = alpha, b1 = 0, b2 = -alpha, a0 = 1 + alpha, a1 = -2 * cw, a2 = 1 - alpha;
  return { b0: b0 / a0, b1: b1 / a0, b2: b2 / a0, a1: a1 / a0, a2: a2 / a0 };
}
const BANDS = [
  { f: 110, Q: 0.9 },   // 低频：贝斯/底鼓
  { f: 330, Q: 0.9 },   // 中低：和弦低音
  { f: 1100, Q: 0.9 },  // 中高：钢琴/人声主体
  { f: 3400, Q: 0.9 },  // 高频：镲片/齿音
];

function nextTick() { return new Promise(function (r) { setTimeout(r, 0); }); }

/* 起音分析核心：只接收单声道数据 —— 同一份源码既在主线程运行（兜底），也被注入 Web Worker */
async function analyzeMono(mono, sr, onProgress) {
  const L = mono.length;
  const hop = 512, nFrames = Math.max(1, Math.floor(L / hop));
  onProgress(0.10);
  await nextTick();      // 让出主线程，保证进度条能刷新（否则页面看起来像卡死）
  // 2) 分频带能量（增量累加到帧桶）
  const nb = BANDS.length;
  const energy = [];
  for (let b = 0; b < nb; b++) energy.push(new Float32Array(nFrames));
  for (let b = 0; b < nb; b++) {
    const k = bpCoeff(BANDS[b].f, BANDS[b].Q, sr);
    let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    const e = energy[b];
    for (let i = 0; i < L; i++) {
      const x0 = mono[i];
      const y0 = k.b0 * x0 + k.b1 * x1 + k.b2 * x2 - k.a1 * y1 - k.a2 * y2;
      x2 = x1; x1 = x0; y2 = y1; y1 = y0;
      e[(i / hop) | 0] += y0 * y0;
    }
    onProgress(0.10 + 0.45 * (b + 1) / nb);
    await nextTick();
  }
  // 3) 谱通量（对数压缩后的正差分）
  const flux = new Float32Array(nFrames);
  const bandArg = new Uint8Array(nFrames);
  const logE = new Float32Array(nb);
  const prev = new Float32Array(nb);
  const total = new Float32Array(nFrames);
  for (let f = 0; f < nFrames; f++) {
    let mx = 0, arg = 0, sum = 0;
    for (let b = 0; b < nb; b++) {
      const v = Math.log(1 + energy[b][f] * 1e5);
      logE[b] = v;
      sum += energy[b][f];
      const d = v - prev[b];
      if (d > 0) { flux[f] += d; if (d > mx) { mx = d; arg = b; } }
      prev[b] = v;
    }
    bandArg[f] = arg;
    total[f] = sum;
  }
  // 4) 峰值挑选：自适应阈值 + 非极大值抑制
  const secPerFrame = hop / sr;
  const w = Math.max(4, Math.round(0.35 / secPerFrame));
  const peaks = [];
  const minGapF = Math.max(2, Math.round(0.055 / secPerFrame));
  for (let f = 2; f < nFrames - 2; f++) {
    const v = flux[f];
    if (v <= 0) continue;
    let sum = 0, cnt = 0;
    for (let j = Math.max(0, f - w); j <= Math.min(nFrames - 1, f + w); j++) { sum += flux[j]; cnt++; }
    const thr = 1.45 * (sum / cnt) + 0.015;
    if (v < thr) continue;
    if (v < flux[f - 1] || v < flux[f + 1]) continue;
    const p = peaks[peaks.length - 1];
    if (p && f - p.f < minGapF) { if (v > p.strength) { p.f = f; p.strength = v; p.band = bandArg[f]; } continue; }
    peaks.push({ f: f, strength: v, band: bandArg[f] });
  }
  onProgress(0.58);
  await nextTick();
  // 5) 丢弃接近静音处的起音
  let medTotal = 0;
  const tmp = Array.prototype.slice.call(total).sort(function (a, b) { return a - b; });
  medTotal = tmp[Math.floor(tmp.length * 0.5)] || 0;
  const alive = peaks.filter(function (p) { return total[p.f] > medTotal * 0.06; });
  onProgress(0.62);
  await nextTick();
  // 6) 长音判定：主频带能量在起音后持续保持在阈值以上
  const holds = new Float32Array(alive.length);
  const holdGap = Math.round(0.22 / secPerFrame);
  for (let i = 0; i < alive.length; i++) {
    if ((i & 511) === 0) { onProgress(0.62 + 0.20 * i / alive.length); await nextTick(); }
    const p = alive[i], b = p.band, e0 = energy[b][p.f];
    if (e0 <= 0) continue;
    const startF = p.f + Math.round(0.12 / secPerFrame);
    const endLimit = Math.min(nFrames - 1, p.f + Math.round(2.5 / secPerFrame));
    let lastOn = p.f;
    for (let f = startF; f <= endLimit; f++) {
      if (energy[b][f] > e0 * 0.42) lastOn = f; else if (f - lastOn > holdGap) break;
    }
    const durS = (lastOn - p.f) * secPerFrame;
    holds[i] = durS >= 0.55 ? Math.min(durS, 2.5) : 0;
  }
  onProgress(0.84);
  await nextTick();
  // 7) BPM 估计（通量包络自相关，用于显示与乐句感）
  let bestLag = 0, bestVal = 0;
  const lagMin = Math.round(0.28 / secPerFrame), lagMax = Math.round(1.4 / secPerFrame);
  let mean = 0;
  for (let f = 0; f < nFrames; f++) mean += flux[f];
  mean /= nFrames;
  for (let lag = lagMin; lag <= lagMax; lag++) {
    if ((lag - lagMin) % 16 === 0) { onProgress(0.84 + 0.14 * (lag - lagMin) / (lagMax - lagMin)); await nextTick(); }
    let s = 0;
    for (let f = 0; f + lag < nFrames; f++) s += (flux[f] - mean) * (flux[f + lag] - mean);
    s /= (nFrames - lag);
    if (s > bestVal) { bestVal = s; bestLag = lag; }
  }
  let bpm = bestLag ? 60 / (bestLag * secPerFrame) : 0;
  // 只做必要的一次折叠，保留原始速度（抒情曲 ~65 BPM 不应被翻倍显示）
  if (bpm > 185) bpm /= 2;
  else if (bpm > 0 && bpm < 50) bpm *= 2;
  bpm = bpm ? Math.round(bpm * 10) / 10 : 0;
  onProgress(0.88);
  await nextTick();
  // 5.5) 静音段：长时间低于平均能量的段落直接清空音符
  const winF = Math.max(1, Math.round(0.5 / secPerFrame));
  const env = [];
  for (let f = 0; f + winF <= nFrames; f += winF) {
    let s = 0;
    for (let j = f; j < f + winF; j++) s += total[j];
    env.push(s / winF);
  }
  let envMean = 0;
  for (let i = 0; i < env.length; i++) envMean += env[i];
  envMean = env.length ? envMean / env.length : 0;
  const silent = [];
  const silThr = envMean * 0.10;
  let run = -1;
  for (let i = 0; i <= env.length; i++) {
    const quiet = i < env.length && env[i] < silThr;
    if (quiet && run < 0) run = i;
    else if (!quiet && run >= 0) {
      const t0 = run * winF * secPerFrame, t1 = i * winF * secPerFrame;
      if (t1 - t0 >= 1.0) silent.push([+t0.toFixed(3), +t1.toFixed(3)]);
      run = -1;
    }
  }
  const inSilent = function (t) {
    for (let i = 0; i < silent.length; i++) if (t >= silent[i][0] && t < silent[i][1]) return true;
    return false;
  };
  const kept = [];
  for (let i = 0; i < alive.length; i++) {
    const p = alive[i];
    const t = Math.max(0, p.f * secPerFrame - 0.006);
    if (inSilent(t)) continue;                       // 静音段：直接清空
    kept.push({ t: +t.toFixed(4), s: +p.strength.toFixed(3), b: p.band, h: +holds[i].toFixed(2) });
  }
  // 6) 用估算 BPM 拟合十六分音符时间网格（量化 + 相位对齐）
  const grid = fitGrid(kept, bpm);
  onProgress(1);
  return { peaks: kept, bpm: bpm, duration: L / sr, grid: grid, silent: silent };
}
/* ---- 主线程下混（复制而非 transfer，避免 detach 掉正在播放的 AudioBuffer） ---- */
function downmixMono(buffer) {
  const nch = Math.min(buffer.numberOfChannels, 2), L = buffer.length;
  const mono = new Float32Array(L);
  for (let c = 0; c < nch; c++) {
    const d = buffer.getChannelData(c);
    for (let i = 0; i < L; i++) mono[i] += d[i] / nch;
  }
  return mono;
}

/* ---- Web Worker：把同一份分析实现注入 Worker，避免长音频分析卡住主线程 ----
   单文件零依赖：用 Blob URL 动态创建；失败（如沙箱限制）时自动回退主线程。 */
const ANALYZER_WORKER_SRC = [
  'var BANDS = ' + JSON.stringify(BANDS) + ';',
  bpCoeff.toString(),
  fitGrid.toString(),
  'function nextTick(){ return Promise.resolve(); }',
  analyzeMono.toString(),
  'self.onmessage = function (e) {',
  '  var d = e.data;',
  '  if (!d || d.type !== "analyze") return;',
  '  var mono = new Float32Array(d.mono);',
  '  analyzeMono(mono, d.sr, function (p) { self.postMessage({ type: "progress", p: p }); })',
  '    .then(function (res) { self.postMessage({ type: "done", result: res }); })',
  '    .catch(function (err) { self.postMessage({ type: "error", message: String(err && err.message || err) }); });',
  '};',
].join('\n');

let analyzerWorker = null;
function analyzerWorkerReady() {
  if (analyzerWorker) return analyzerWorker;
  if (typeof Worker === 'undefined' || typeof Blob === 'undefined' || !URL.createObjectURL) return null;
  try {
    const url = URL.createObjectURL(new Blob([ANALYZER_WORKER_SRC], { type: 'application/javascript' }));
    const w = new Worker(url);
    URL.revokeObjectURL(url);
    analyzerWorker = w;
    return w;
  } catch (e) { return null; }
}
/* 在 Worker 中分析；任何异常都返回 null，由调用方回退主线程 */
function analyzeInWorker(mono, sr, onProgress) {
  const w = analyzerWorkerReady();
  if (!w) return Promise.resolve(null);
  return new Promise(function (resolve) {
    let settled = false;
    const finish = function (v) {
      if (settled) return;
      settled = true;
      w.onmessage = null; w.onerror = null;
      resolve(v);
    };
    w.onmessage = function (e) {
      const m = e.data || {};
      if (m.type === 'progress') { onProgress(0.10 + m.p * 0.88); return; }
      if (m.type === 'done') return finish(m.result);
      if (m.type === 'error') return finish(null);
    };
    w.onerror = function () { finish(null); };
    try {
      w.postMessage({ type: 'analyze', mono: mono.buffer, sr: sr }, [mono.buffer]);   // 零拷贝移交
    } catch (err) { return finish(null); }
  });
}

/* ---- 对外接口：优先 Worker，失败自动回退主线程 ---- */
async function analyzeBuffer(buffer, onProgress) {
  const sr = buffer.sampleRate;
  const wasWorker = !!analyzerWorkerReady();
  const mono = wasWorker ? downmixMono(buffer) : null;
  if (wasWorker) {
    const res = await analyzeInWorker(mono, sr, onProgress);
    if (res) { res.worker = true; return res; }
  }
  // 兜底：主线程分析（mono 已被 transfer 时重新下混）
  return analyzeMono(mono && mono.length ? mono : downmixMono(buffer), sr, onProgress);
}

/* 用估算 BPM 建立十六分音符时间网格：
   以估算 BPM 为准做相位直方图搜索；仅当拟合极差（疑似倍/半速错误）时才尝试八度折叠。
   返回 { step, phase, bpm, ratio }，ratio = 落在 ±40% 步长内的起音强度占比。 */
function fitGrid(peaks, bpm) {
  if (!peaks.length) return { step: 0.125, phase: 0, bpm: bpm || 0, ratio: 0 };
  const tryTempo = function (tempo) {
    const step = (60 / tempo) / 4;                    // 十六分音符步长
    const BINS = 32;
    const hist = new Float64Array(BINS);
    peaks.forEach(function (p) {

    if (wantS >= 4) cand.push({ n: n, wantS: wantS, h: n._h });   // 至少半拍才有意义
  }
  cand.sort(function (a, b) { return b.h - a.h; });              // 只保留持续最久的前 N 条
  cand.slice(0, holdCap).forEach(function (c) {
    c.n.type = 'hold'; c.n.dur = +(c.wantS * step).toFixed(4);
  });
  out.forEach(function (n) { delete n._h; delete n._picked; });
  const spbA = step * 4;                    // 网格步长 ×4 = 一拍
  const res = applyFingerLimit(applyHoldSideBan(validateChart(out, step, diff), spbA), spbA);
  /* 长条二道闸：上面那道闸用的是"过滤前"的长度，实际成谱后被删掉一批音符，
     长条占比会明显超标（实测春日影 hard 曾达 49%）。这里按"最终长度"再卡一次，
     多出来的长条退回普通音符（保留时长最长的那些）。 */
  const holdMax = Math.max(2, Math.round(res.length * st.holdCap * tpl.holdMul));
  const hsAll = res.filter(function (n) { return n.type === 'hold'; });
  if (hsAll.length > holdMax) {
    hsAll.sort(function (a, b) { return b.dur - a.dur || a.time - b.time; });
    for (let q = holdMax; q < hsAll.length; q++) { hsAll[q].type = 'tap'; hsAll[q].dur = 0; }
  }
  /* 最后一道闸：按住中的长条算占手指，窗口内超限就丢点击 */
  const res2 = enforceFingerCap(res.slice().sort(function (a, b) { return a.time - b.time || a.lane - b.lane; }),
    fingerCap(), 0.04);
  res2._profile = prof;                      // 风格指纹（供界面显示）
  res2._tpl = tpl.id;
  return res2;
}

/* 生成后体检：清掉"同轨同时刻"这类真正的输入冲突，以及同轨过密（一个轨要在极短时间内按两下）。
   返回清理后的谱面；调用方无需关心细节。 */
function validateChart(list, step, diff) {
  const minGap = (MIN_STEPS[diff] || 1) * step * 0.9;
  const sorted = list.slice().sort(function (a, b) { return a.time - b.time || a.lane - b.lane; });
  const seen = {}, out = [];
  const lastEnd = [-1e9, -1e9, -1e9, -1e9];
  for (let i = 0; i < sorted.length; i++) {
    const n = sorted[i];
    const key = n.lane + '@' + n.time.toFixed(4);
    if (seen[key]) continue;                                        // 同轨同时刻：真冲突
    if (n.time - lastEnd[n.lane] < minGap) continue;                // 同轨过密
    seen[key] = 1;
    lastEnd[n.lane] = n.time + (n.type === 'hold' ? n.dur : 0);
    out.push(n);
  }
  return out;
}

  return [(isCoarse() ? 'M' : 'P'), settings.chartMode, settings.snap, settings.nps, settings.bpm].join('|');   // 手机端有额外的可玩性限制，故各用一套谱面
}
function chartsFor(song, diff) {
  attachPan(song);                       // 有音频缓冲且尚未算过定位 → 先算，随后谱面自动重算
  if (song.kind === 'proc') return song.charts[diff];

  if (song._chartSig !== sig) { song._charts = {}; song._chartSig = sig; }   // 参数变更 → 作废缓存
  if (!song._charts) song._charts = {};
  if (!song._charts[diff]) {
    let grid = song.grid;
    if (settings.bpm > 0 && song.peaks && song.peaks.length) grid = fitGrid(song.peaks, settings.bpm);
    song._charts[diff] = chartFromPeaks(song.peaks, diff, song.duration, grid);
  }
  return song._charts[diff];
}

/* ---------------- IndexedDB：本地歌曲持久化 ----------------
   记录结构 { id, name, bpm, duration, size, createdAt, peaks, blob } */
const DB = { name: 'rsn-songs', ver: 1, conn: null, ok: false, tried: false };
function dbOpen() {
  return new Promise(function (res) {
    if (DB.conn) return res(DB.conn);
    if (DB.tried && !DB.ok) return res(null);
    DB.tried = true;
    let req;
    try { req = indexedDB.open(DB.name, DB.ver); } catch (e) { return res(null); }
    req.onupgradeneeded = function () {
      const db = req.result;
      if (!db.objectStoreNames.contains('songs')) db.createObjectStore('songs', { keyPath: 'id' });
    };
    req.onsuccess = function () { DB.conn = req.result; DB.ok = true; res(DB.conn); };
    req.onerror = function () { DB.ok = false; res(null); };
    req.onblocked = function () { res(null); };
  });
}
function dbReq(mode, fn) {
  return dbOpen().then(function (db) {
    if (!db) return null;
    return new Promise(function (res) {
      let tx;
      try { tx = db.transaction('songs', mode); } catch (e) { return res(null); }
      const store = tx.objectStore('songs');
      let r;
      try { r = fn(store); } catch (e) { return res(null); }
      if (!r) return res(null);
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { res(null); };
    });
  });
}
const dbList = () => dbReq('readonly', s => s.getAll());
const dbGet = id => dbReq('readonly', s => s.get(id));
const dbPut = rec => dbReq('readwrite', s => s.put(rec));
const dbDel = id => dbReq('readwrite', s => s.delete(id));
const dbClear = () => dbReq('readwrite', s => s.clear());

/* 把导入的歌曲写入 IndexedDB（音频 Blob + Peaks 特征 + 元信息） */
async function persistSong(song, blob) {
  const rec = {
    id: song.id, name: song.name, bpm: song.bpm, duration: song.duration,
    size: blob ? blob.size : 0, createdAt: Date.now(),
    peaks: song.peaks, grid: song.grid || null, blob: blob || null,
  };
  const ok = await dbPut(rec);
  song.persisted = !!ok;
  if (!ok) console.warn('IndexedDB 写入失败（歌曲仍可在本次会话游玩）');
  return ok;
}
/* 启动时恢复列表（只取元信息，选中后再解码音频） */
async function restoreSongs() {
  const list = await dbList();
  if (!list || !list.length) return 0;
  let n = 0;
  list.sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
  list.forEach(function (r) {
    if (!r || !r.id || findSong(r.id)) return;
    SONGS.push({
      id: r.id, kind: 'audio', name: r.name || 'AUDIO', bpm: r.bpm || 0,
      duration: r.duration || 0, peaks: Array.isArray(r.peaks) ? r.peaks : null,
      grid: r.grid || null, blob: r.blob || null, imported: true,
      stale: !r.blob || !Array.isArray(r.peaks) || !r.peaks.length,   // 缓存被浏览器清理
    });
    n++;
  });
  return n;
}

/* 从本地文件载入音频曲目（解码 + 起音分析 + 缓存） */
async function loadAudioSong(file, onProgress) {
  initAudio();
  await resumeAudio();
  const token = ++loadToken;
  const buf = await file.arrayBuffer();
  onProgress(0.05, t('decoding'));
  const audio = await actx.decodeAudioData(buf.slice(0));
  if (token !== loadToken) return null;
  const name = (file.name || 'AUDIO').replace(/\.[a-z0-9]+$/i, '').slice(0, 120);
  const id = 'f' + hashStr(name + ':' + file.size);
  onProgress(0.10, t('analyzing'));
  const cached = readCache(id);
  let peaks = cached ? cached.peaks : null;
  let bpm = cached ? cached.bpm : 0;
  let grid = cached ? cached.grid : null;
  if (!peaks) {
    const res = await analyzeBuffer(audio, function (p, label) {
      onProgress(0.10 + p * 0.88, label || t('analyzing'));
    });
    if (token !== loadToken) return null;
    peaks = res.peaks; bpm = res.bpm; grid = res.grid;
    writeCache(id, peaks, bpm, grid);
  }
  if (!grid) grid = fitGrid(peaks, bpm);
  onProgress(1, t('analyzing'));
  return { id: id, kind: 'audio', name: name, duration: audio.duration, buffer: audio,
           peaks: peaks, bpm: bpm, grid: grid };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}
function cacheKey(id) { return 'rsn.peaks.' + id; }
function readCache(id) {
  try {
    const raw = localStorage.getItem(cacheKey(id));
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (!o || !o.p || !o.p.length) return null;
    return { peaks: o.p, bpm: o.b || 0, grid: o.g || null };   // 旧缓存没有网格则在使用时重算
  } catch (e) { return null; }
}
function writeCache(id, peaks, bpm, grid) {
  try {
    let arr = peaks, step = 1;
    for (let i = 0; i < 3; i++) {
      const raw = JSON.stringify({ b: bpm, p: arr, g: grid || null });
      if (raw.length < 900000) { localStorage.setItem(cacheKey(id), raw); return; }
      step++; arr = peaks.filter(function (_, k) { return k % step === 0; });
    }
  } catch (e) {}
}

function viewSize() {                    // 手机地址栏/导航栏会改变可用高度：优先用 visualViewport
  const vv = window.visualViewport;
  return {
    w: Math.round((vv && vv.width) ? vv.width : window.innerWidth),
    h: Math.round((vv && vv.height) ? vv.height : window.innerHeight)
  };
}
function layout() {
  const vs = viewSize();
  const isMobile = plat.cfg.layoutMode === 'handset';
  const dpr = Math.min(window.devicePixelRatio || 1, plat.cfg.render.dprCap);
  W = vs.w; H = vs.h;
  cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const pfW = Math.floor(Math.min(W * 0.96, H * 0.72, 660));
  PIN.w = pfW; PIN.laneW = pfW / 4;
  PIN.x = Math.floor((W - pfW) / 2);
  // 判定线位置：手机模式给底部键垫留出足够手指面积（横屏尤其重要）
  PIN.judgeY = Math.min(Math.floor(H * (isMobile ? 0.78 : 0.80)), H - (plat.cfg.touch.minPadH + 6));
  PIN.top = 0;
  noteH = clamp(PIN.laneW * 0.20, 12, 26);

  fxScale = REDUCED ? 0.35 : plat.cfg.render.particles;   // 粒子密度由模式配置决定（PC 不因手机配置降级）
  applyWindowScale();   // 移动端判定窗口放宽（依赖 W/H）
  updateSpeed();
}

  const travel = (DIFF[settings.diff].travel) / clamp(settings.speed, 0.5, 2);
  pxPerSec = (PIN.judgeY + 90) / travel;
}

let lastQuote = '';
function pickQuote(pool) {
  if (!pool || !pool.length) return '';
  let s = pool[Math.floor(Math.random() * pool.length)];
  if (pool.length > 1 && s === lastQuote) s = pool[(pool.indexOf(s) + 1) % pool.length];
  lastQuote = s;
  return s;
}
/* 主界面：每次进入随机一条 */
function rollMenuQuote() {
  const el = document.getElementById('menuQuote');
  if (!el) return;
  el.textContent = pickQuote(MENU_QUOTES[Math.floor(Math.random() * MENU_QUOTES.length)]);
}
/* 结算：按成绩选组，另有 30% 概率取通用组 */
function rollResultQuote(rank, isFail) {
  const el = document.getElementById('resQuote');
  if (!el) return;
  let pool;
  if (isFail || rank === 'D') pool = RESULT_QUOTES.low;
  else if (rank === 'AP' || rank === 'S+') pool = RESULT_QUOTES.high;
  else if (rank === 'S' || rank === 'A') pool = RESULT_QUOTES.good;
  else pool = RESULT_QUOTES.mid;
  if (Math.random() < 0.3) pool = RESULT_QUOTES.any;
  el.textContent = pickQuote(pool);
}

      const ni = nm.firstChild;

      const over = Math.max(nm.scrollWidth, ni.offsetWidth) - nm.clientWidth;

/* 从 IndexedDB 恢复的曲目：按需解码（无需重新分析） */
async function loadPersistedSong(song) {
  if (song._loading) return;
  song._loading = true;
  $('loadErr').textContent = '';
  $('loadName').textContent = song.name;
  showScreen('load');
  loadProgress(0.1, t('loadingSong'));
  try {
    initAudio();                      // 不能依赖全局解锁事件，这里自行确保 AudioContext 存在
    const rec = await dbGet(song.id);
    if (!rec || !rec.blob) { const e = new Error('stale'); e.stale = true; throw e; }
    const ab = await rec.blob.arrayBuffer();
    loadProgress(0.45, t('decoding'));
    const audio = await actx.decodeAudioData(ab);
    if (!song.peaks || !song.peaks.length) {
      const res = await analyzeBuffer(audio, function (p, label) {
        loadProgress(0.45 + p * 0.5, label || t('analyzing'));
      });
      song.peaks = res.peaks; song.bpm = res.bpm; song.grid = res.grid;
      await persistSong(song, rec.blob);
    }
    if (!song.grid) song.grid = fitGrid(song.peaks, song.bpm);
    song.buffer = audio;
    song.duration = audio.duration;
    song._charts = null;
    song.stale = false;
    loadProgress(1, t('loadingSong'));
    SONG = song;
    renderSongList();
    applyI18n();
    if (song._autoStart) { song._autoStart = false; startGame(); return; }
    if (song._selectAfterLoad) {                // 导入/解码完成：先离开加载页，再选中该曲
      song._selectAfterLoad = false;
      showScreen('tracks');
      selectOnly(song);
      return;
    }
    if (song._openDetail) { song._openDetail = false; openTrackDetail(song); return; }
    showScreen('tracks');
  } catch (e) {
    song._autoStart = false;
    showScreen('tracks');
    if (e && e.stale) {
      // 音频 Blob 已被浏览器清理：提示后移除该记录（back 指定回到音轨屏）
      song.stale = true;
      renderSongList();
      showDialog({
        title: t('staleTitle'), text: t('staleDesc') + '\n' + song.name,
        ok: t('gotIt'), back: 'tracks',
        onOk: function () { removeSong(song); },
      });
    } else {
      // 其它错误（解码失败等）不要误报成缓存失效；同样提示后移除，并留在音轨屏
      showDialog({
        title: t('loadFail'), text: String((e && e.message) || e).slice(0, 120),
        ok: t('ok'), back: 'tracks',
        onOk: function () { removeSong(song); },
      });
    }
  } finally {
    song._loading = false;
  }
}
function decodeBase64Audio(b64) {
  const bin = atob(b64);
  const len = bin.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
function loadProgress(p, label) {

  $('loadPct').textContent = pct + '%';
}
async function loadFromBlob(blob, fileName, toScreen) {
  if (state === 'play') return null;
  $('loadErr').textContent = '';
  $('loadName').textContent = fileName || '';
  showScreen('load');
  loadProgress(0.02, t('decoding'));
  try {
    const file = new File([blob], fileName || 'audio');
    const song = await loadAudioSong(file, loadProgress);
    if (!song) return;
    song.imported = true;
    song.blob = file;
    const exist = findSong(song.id);
    if (exist) { const i = SONGS.indexOf(exist); SONGS.splice(i, 1); }   // 同曲重新导入则覆盖
    SONGS.push(song);
    await persistSong(song, file);        // 音频 Blob + Peaks + 元信息写入 IndexedDB
    SONG = song;
    renderSongList();
    applyI18n();
    refreshStorage();
    if (toScreen) showScreen(toScreen);
    return song;
  } catch (e) {
    $('loadLabel').textContent = t('loadFail');

    return null;
  }
}

const AUDIO_RE = /\.(mp3|wav|ogg|oga|m4a|aac|flac|opus|webm|weba|mp4)$/i;

  const name = el.getAttribute('data-name') || 'EMBEDDED';
  const id = el.getAttribute('data-id') || 'embedded';
  embeddedSong = { id: id, kind: 'audio', name: name, b64: el.textContent.trim(), duration: 0, peaks: null, embedded: true };

async function prepareEmbedded(auto) {

  $('loadErr').textContent = '';
  $('loadName').textContent = embeddedSong.name;
  showScreen('load');

  try {
    // 注意：解码不依赖用户手势，这里不能 await resume()（未交互时可能永挂起）
    initAudio();

    if (!peaks) {
      const res = await analyzeBuffer(audio, function (p, label) {
        loadProgress(0.10 + p * 0.88, label || t('analyzing'));

    }
    embeddedSong.buffer = audio;
    embeddedSong.duration = audio.duration;
    embeddedSong.peaks = peaks;
    loadProgress(1, t('analyzing'));

    if (state === 'play' || state === 'paused') return;

function rebuildMusicBus() {

function stopMusic(fast) {
  if (!actx) return;
  const suspended = actx.state === 'suspended';   // 挂起时 currentTime 冻结，不能排程未来时间
  const now = actx.currentTime;
  if (suspended) {
    // 时钟冻结、此刻本来就没有声音：直接归零不会产生爆音
    try { musicBus.gain.cancelScheduledValues(now); musicBus.gain.value = 0; } catch (e) {}
    if (bgmSrc) { try { bgmSrc.stop(0); bgmSrc.disconnect(); } catch (e) {} bgmSrc = null; }
    if (fast) rebuildMusicBus();
    return;
  }
  if (fast) {
    // 快杀但平滑：12ms 内滑到 0（增益突变正是"重开爆音"的来源），再断开旧总线
    try {
      musicBus.gain.cancelScheduledValues(now);
      musicBus.gain.setValueAtTime(musicBus.gain.value, now);
      musicBus.gain.linearRampToValueAtTime(0, now + 0.012);
    } catch (e) {}
    if (bgmSrc) { try { bgmSrc.stop(now + 0.02); } catch (e) {} bgmSrc = null; }   // 等淡完再停，避免截断爆音
    const old = musicBus;
    setTimeout(function () { try { old.disconnect(); } catch (e) {} }, 80);
    rebuildMusicBus();
    return;
  }
  try {
    musicBus.gain.cancelScheduledValues(now);
    musicBus.gain.setTargetAtTime(0, now, 0.2);
  } catch (e) {}
  if (bgmSrc) { try { bgmSrc.stop(now + 0.8); } catch (e) {} bgmSrc = null; }

/* ---------------------- 偏移校准向导 ----------------------
   跟 8 拍节拍点击，测出"你的点击比听到的节拍晚/早多少"，写回 settings.offset。
   注意：offset 只作用于判定时刻（hitLane 里 now = songTime() - offset/1000），
   音乐与视觉始终对齐——这是刻意的，避免视觉跟着偏移后与音频脱节。 */
let calib = { clicks: [], taps: [], running: false, timers: [], value: 0 };
function calibClear() {
  (calib.timers || []).forEach(clearTimeout);
  calib.timers = [];
}
function calibTap() {
  if (!calib.running || !actx) return;
  const tt = actx.currentTime;
  let best = null, bd = 1e9;
  for (let i = 0; i < calib.clicks.length; i++) {
    const d = Math.abs(tt - calib.clicks[i]);
    if (d < bd) { bd = d; best = calib.clicks[i]; }
  }
  if (best === null || bd > 0.25) return;            // 离任何节拍都超过 250ms：忽略（不是跟拍）
  calib.taps.push((tt - best) * 1000);
  const el = $('calibStat');
  if (el) el.textContent = t('calibGot') + ' ' + calib.taps.length;
}
function calibResult() {
  const a = calib.taps.slice(2);                     // 丢掉前两次热身
  const el = $('calibStat'), btn = $('btnCalibApply');
  if (a.length < 3) { if (el) el.textContent = t('calibFew'); if (btn) btn.disabled = true; return; }
  a.sort(function (x, y) { return x - y; });
  const med = a[Math.floor(a.length / 2)];
  const mean = a.reduce(function (x, y) { return x + y; }, 0) / a.length;
  const sd = Math.sqrt(a.reduce(function (x, y) { return x + (y - mean) * (y - mean); }, 0) / a.length);
  calib.value = Math.max(-150, Math.min(150, Math.round(med)));
  if (el) el.textContent = t('calibOff') + ' ' + (calib.value > 0 ? '+' : '') + calib.value + ' ms\n' +
    '(' + a.length + ' ' + t('calibTimes') + ' · σ ' + Math.round(sd) + ' ms)';
  if (btn) btn.disabled = false;
}
function calibStart() {
  initAudio();
  if (!actx) return;
  resumeAudio().then(function () {
    calibClear();
    calib.clicks = []; calib.taps = []; calib.running = true; calib.value = 0;
    $('btnCalibApply').disabled = true;
    $('calibStat').textContent = t('calibReady');
    const t0 = actx.currentTime + 1.4, gap = 0.5;     // 120 BPM × 8 拍
    for (let i = 0; i < 8; i++) {
      const at = t0 + i * gap;
      calib.clicks.push(at);
      calib.timers.push(setTimeout(function () {
        tickSfx(at, i === 0);
        const d = $('calibDot');
        if (d) { d.classList.add('on'); setTimeout(function () { d.classList.remove('on'); }, 90); }
      }, Math.max(0, (at - actx.currentTime) * 1000)));
    }
    calib.timers.push(setTimeout(function () {
      calib.running = false;
      calibResult();
    }, (t0 + 8 * gap - actx.currentTime) * 1000 + 350));
    showScreen('calib');
  });
}
window.addEventListener('keydown', function () {
  if (calib.running && $('scrCalib') && $('scrCalib').classList.contains('on')) calibTap();
});
window.addEventListener('pointerdown', function (e) {
  if (!calib.running) return;
  const el = $('scrCalib');
  if (el && el.classList.contains('on') && e.target && e.target.closest && !e.target.closest('button')) calibTap();
